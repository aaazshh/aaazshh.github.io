<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44">
  <!-- A round paintbrush lying on the desk, painted to sit with the rest of
       the picture: soft, warm, light coming in from the top right. The tip is
       at (4, 21), which is where journal.js holds it from. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b089"/>
      <stop offset=".3" stop-color="#f6d4b2"/>
      <stop offset=".58" stop-color="#d4916a"/>
      <stop offset="1" stop-color="#a86d4b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6cbbd"/>
      <stop offset=".28" stop-color="#fdf8f0"/>
      <stop offset=".62" stop-color="#bcae9c"/>
      <stop offset="1" stop-color="#8e7e6c"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f76c2"/>
      <stop offset=".3" stop-color="#b19ad8"/>
      <stop offset=".52" stop-color="#dcc3a2"/>
      <stop offset="1" stop-color="#f0dcba"/>
    </linearGradient>
    <linearGradient id="hairShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b4a33" stop-opacity=".28"/>
    </linearGradient>
    <filter id="paint" x="-4%" y="-40%" width="108%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".32"/>
    </filter>
    <filter id="shadow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <path d="M6 24 C 24 17 42 17 54 18.5 L 82 18 C 118 16.5 172 17 207 18.5 Q 215 19 215 23 Q 215 27 207 27.5 C 172 29 118 29.5 82 28 L 54 27.5 C 42 29 24 29 6 24 Z"
        fill="#6e4a30" opacity=".2" filter="url(#shadow)" transform="translate(-4 7)"/>

  <g filter="url(#paint)">
    <!-- handle: fattest just behind the ferrule, tapering to a rounded end -->
    <path d="M78 16.2 C 100 14.6 118 14.2 140 15.2 C 170 16.4 194 17.4 207 17.8 Q 214 18.1 214 21 Q 214 23.9 207 24.2 C 194 24.6 170 25.6 140 26.8 C 118 27.8 100 27.4 78 25.8 Z" fill="url(#wood)"/>
    <path d="M84 17.6 C 110 16 140 16.4 205 18.9" stroke="#fff6ea" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".75"/>
    <path d="M86 24.6 C 120 25.8 160 24.8 204 23.2" stroke="#8f5a3c" stroke-width=".9" stroke-linecap="round" fill="none" opacity=".35"/>
    <!-- a ring of paint on the handle -->
    <path d="M186 17.2 L 193 17.5 L 193 24.6 L 186 24.9 Z" fill="#b39ddb" opacity=".85"/>
    <path d="M186 17.4 L 193 17.6" stroke="#fff" stroke-width=".7" opacity=".6"/>

    <!-- ferrule -->
    <path d="M50 15.6 Q 52 14.6 55 14.7 L 80 15.8 L 80 26.2 L 55 27.3 Q 52 27.4 50 26.4 Z" fill="url(#metal)"/>
    <path d="M73 15.4 V 26.6 M 76.5 15.6 V 26.4" stroke="#8a7a68" stroke-width=".8" opacity=".6"/>
    <path d="M56 16.8 L 79 17.4" stroke="#fff" stroke-width=".9" stroke-linecap="round" opacity=".8"/>

    <!-- bristles, dipped in lilac -->
    <path d="M51.5 15.9 C 38 14.4 22 15.2 4 21 C 22 26.8 38 27.6 51.5 26.1 Z" fill="url(#hair)"/>
    <path d="M51.5 15.9 C 38 14.4 22 15.2 4 21 C 22 26.8 38 27.6 51.5 26.1 Z" fill="url(#hairShade)"/>
    <path d="M48 18.4 C 34 17.6 20 18.6 8 21 M 48 23.6 C 34 24.6 20 23.6 8 21.2 M 46 21 C 32 20.8 18 20.8 6 21"
          stroke="#7d64ae" stroke-width=".55" fill="none" opacity=".45"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Environment Survey, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="environment" data-title="Environment Survey" data-crumb="Environment Survey">

  <div id="content">
    <div class="grid g4" id="stats"></div>

    <div class="grid g2" style="margin-top:16px;">
      <div class="card mb-4">
        <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
          <div><h6 class="mb-1">Dissolved oxygen</h6><p class="text-sm text-secondary mb-0">Farm 1, morning reading, mg per litre</p></div>
          <span class="badge badge-sm bg-gradient-warning">Below 5.0 is a problem</span>
        </div>
        <div class="card-body"><div class="bars" id="o2"></div></div>
      </div>

      <div class="card mb-4">
        <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
          <div><h6 class="mb-1">Water temperature</h6><p class="text-sm text-secondary mb-0">Farm 1, morning reading, celsius</p></div>
        </div>
        <div class="card-body"><div class="bars" id="temp"></div></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Survey log</h6><p class="text-sm text-secondary mb-0">Taken off the pontoon at first light, both farms</p></div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="d-flex flex-column">
            <label for="farm" class="text-xxs text-uppercase text-secondary font-weight-bolder mb-1">Farm</label>
            <select id="farm" class="form-control form-control-sm"><option>All farms</option><option>Farm 1</option><option>Farm 2</option></select>
          </div>
          <button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-unbuilt="Adding a survey">Add survey</button>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Taken</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Farm</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Temp</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Oxygen</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">pH</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Salinity</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Water</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">By</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    var farm1 = DATA.surveys.filter(function (s) { return s.farm === 1; }).slice().reverse();
    var latest = DATA.surveys[0];

    document.getElementById('stats').innerHTML = [
      ['Temperature', latest.temp + '°C', 'Farm 1, this morning', latest.temp > 30 ? 'warn' : 'good'],
      ['Dissolved oxygen', latest.o2 + ' mg/L', 'Healthy above 5.0', latest.o2 < 5 ? 'bad' : 'good'],
      ['pH', latest.ph, 'Sits between 7.8 and 8.3', 'good'],
      ['Salinity', latest.sal + ' ppt', 'Steady this week', 'good']
    ].map(function (s) {
      return '<div class="card mb-4"><div class="stat"><div>' +
        '<div class="label">' + s[0] + '</div><div class="value">' + s[1] + '</div>' +
        '<div class="sub">' + s[2] + '</div></div>' +
        '<span class="badge badge-sm bg-gradient-' + s[3] + '" style="margin-left:auto;">' + (s[3] === 'good' ? 'normal' : s[3] === 'warn' ? 'watch' : 'low') + '</span>' +
        '</div></div>';
    }).join('');

    function bars(into, values, labels, low) {
      var min = Math.min.apply(null, values) * 0.92;
      var max = Math.max.apply(null, values);
      document.getElementById(into).innerHTML = values.map(function (v, i) {
        var h = Math.round((v - min) / (max - min || 1) * 90) + 20;
        return '<div><b style="font-size:11.5px;">' + v + '</b>' +
          '<i style="height:' + h + 'px' + (low && v < low ? ';background:linear-gradient(180deg,#e06a66,#b8322e)' : '') + '"></i>' +
          '<span>' + labels[i] + '</span></div>';
      }).join('');
    }

    var labels = farm1.map(function (s) { return s.date.split(' ')[0] === 'Today' ? 'Today' : s.date.replace(/ \d.*/, ''); });
    bars('o2', farm1.map(function (s) { return s.o2; }), labels, 5);
    bars('temp', farm1.map(function (s) { return s.temp; }), labels);

    var farm = document.getElementById('farm');

    function paint() {
      var rows = DATA.surveys.filter(function (s) {
        return farm.value === 'All farms' || 'Farm ' + s.farm === farm.value;
      });

      document.getElementById('rows').innerHTML = rows.map(function (s) {
        return '<tr>' +
          '<td class="text-xs text-secondary">' + s.date + '</td>' +
          '<td>Farm ' + s.farm + '</td>' +
          '<td class="text-center text-sm">' + s.temp.toFixed(1) + '°C</td>' +
          '<td class="text-center text-sm">' + (s.o2 < 5
            ? '<span class="badge badge-sm bg-gradient-danger">' + s.o2.toFixed(1) + '</span>'
            : s.o2.toFixed(1)) + '</td>' +
          '<td class="text-center text-sm">' + s.ph.toFixed(1) + '</td>' +
          '<td class="text-center text-sm">' + s.sal + ' ppt</td>' +
          '<td>' + (s.turb === 'Clear' ? '<span class="badge badge-sm bg-gradient-success">Clear</span>'
            : s.turb === 'Murky' ? '<span class="badge badge-sm bg-gradient-danger">Murky</span>'
            : '<span class="badge badge-sm bg-gradient-warning">' + s.turb + '</span>') + '</td>' +
          '<td class="text-xs text-secondary">' + s.by + '</td>' +
          '</tr>';
      }).join('');
    }

    farm.addEventListener('change', paint);
    paint();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
</head>
<body data-page="feed" data-title="Feed" data-sub="Operations">

  <div id="content">
    <div class="grid split">
      <div class="card">
        <div class="card-head"><div><h2>Store</h2><p>Bags on the pontoon</p></div></div>
        <div class="card-body"><div id="store"></div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div><h2>Feed out, last 7 days</h2><p>Kilos, every cage</p></div>
          <span class="pill" id="week"></span>
        </div>
        <div class="card-body"><div class="bars" id="bars"></div></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-head">
        <div><h2>Today's rounds</h2><p>Logged from the app as each cage is fed</p></div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="field">
            <label for="session">Session</label>
            <select id="session"><option>All sessions</option><option>Morning</option><option>Noon</option><option>Evening</option></select>
          </div>
          <button type="button" class="btn" data-skip="Recording a feeding">Record feeding</button>
        </div>
      </div>
      <div class="wrap">
        <table>
          <thead><tr><th>Session</th><th>Cage</th><th>Species</th><th>Feed</th><th class="num">Kilos</th><th class="num">Per 1000 fish</th><th>By</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    'use strict';

    document.getElementById('store').innerHTML = DATA.feeds.map(function (f) {
      var kg = f.bags * f.kg;
      var perDay = f.used7 / 7 * 25;
      var days = Math.round(kg / perDay);
      return '<div style="display:grid;grid-template-columns:1fr auto;gap:3px;padding:11px 0;border-bottom:1px solid var(--ff-line);">' +
        '<div style="font-size:14px;font-weight:600;">' + f.name + '</div>' +
        '<div>' + (f.low ? '<span class="pill warn">' + days + ' days left</span>' : '<span class="pill good">' + days + ' days left</span>') + '</div>' +
        '<div class="dim" style="font-size:12px;">' + f.bags + ' bags of ' + f.kg + ' kg, ' + f.supplier + '</div>' +
        '<div class="num dim" style="font-size:12px;">' + kg.toLocaleString() + ' kg</div>' +
        '<div style="grid-column:1/3;height:6px;border-radius:3px;background:var(--ff-pale);overflow:hidden;margin-top:4px;">' +
          '<span style="display:block;height:100%;width:' + Math.min(100, days / 30 * 100) + '%;background:' +
          (f.low ? '#e08a16' : 'linear-gradient(90deg,var(--ff-bright),var(--ff-teal))') + ';"></span>' +
        '</div></div>';
    }).join('');

    var max = Math.max.apply(null, DATA.feedTrend);
    document.getElementById('bars').innerHTML = DATA.feedTrend.map(function (v, i) {
      return '<div><b style="font-size:11.5px;">' + v + '</b>' +
        '<i style="height:' + Math.round(v / max * 110) + 'px"></i>' +
        '<span>' + DATA.days[i] + '</span></div>';
    }).join('');

    document.getElementById('week').textContent =
      DATA.feedTrend.reduce(function (a, b) { return a + b; }, 0).toLocaleString() + ' kg out this week';

    var session = document.getElementById('session');

    function paint() {
      var want = session.value;
      var rows = DATA.feedings.filter(function (f) {
        return want === 'All sessions' || f.session === want;
      });

      document.getElementById('rows').innerHTML = rows.length ? rows.map(function (f) {
        var c = DATA.cage(f.cage);
        return '<tr>' +
          '<td><span class="pill">' + f.session + '</span></td>' +
          '<td><strong>' + f.cage + '</strong></td>' +
          '<td>' + (c ? c.species : '') + '</td>' +
          '<td>' + f.feed + '</td>' +
          '<td class="num">' + f.kg + ' kg</td>' +
          '<td class="num dim">' + (c && c.stock ? (f.kg / c.stock * 1000).toFixed(1) + ' kg' : '-') + '</td>' +
          '<td class="dim">' + f.by + '</td>' +
          '</tr>';
      }).join('') : '<tr><td colspan="7" class="dim" style="padding:26px;text-align:center;">No round logged for that session yet.</td></tr>';
    }

    session.addEventListener('change', paint);
    paint();
  </script>
</body>
</html>

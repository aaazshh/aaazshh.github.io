<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="feed" data-title="Feed" data-crumb="Feed">

  <div id="content">
    <div class="grid split">
      <div class="card mb-4">
        <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2"><div><h6 class="mb-1">Store</h6><p class="text-sm text-secondary mb-0">Bags on the pontoon</p></div></div>
        <div class="card-body"><div id="store"></div></div>
      </div>

      <div class="card mb-4">
        <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
          <div><h6 class="mb-1">Feed out, last 7 days</h6><p class="text-sm text-secondary mb-0">Kilos, every cage</p></div>
          <span class="badge badge-sm bg-gradient-info" id="week"></span>
        </div>
        <div class="card-body"><div class="bars" id="bars"></div></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Today's rounds</h6><p class="text-sm text-secondary mb-0">Logged from the app as each cage is fed</p></div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="d-flex flex-column">
            <label for="session" class="text-xxs text-uppercase text-secondary font-weight-bolder mb-1">Session</label>
            <select id="session" class="form-control form-control-sm"><option>All sessions</option><option>Morning</option><option>Noon</option><option>Evening</option></select>
          </div>
          <button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-unbuilt="Recording a feeding">Record feeding</button>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Session</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Species</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Feed</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Kilos</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Per 1000 fish</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">By</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    document.getElementById('store').innerHTML = DATA.feeds.map(function (f) {
      var kg = f.bags * f.kg;
      var perDay = f.used7 / 7 * 25;
      var days = Math.round(kg / perDay);
      return '<div style="display:grid;grid-template-columns:1fr auto;gap:3px;padding:11px 0;border-bottom:1px solid var(--ff-line);">' +
        '<div style="font-size:14px;font-weight:600;">' + f.name + '</div>' +
        '<div>' + (f.low ? '<span class="badge badge-sm bg-gradient-warning">' + days + ' days left</span>' : '<span class="badge badge-sm bg-gradient-success">' + days + ' days left</span>') + '</div>' +
        '<div class="text-xs text-secondary" style="font-size:12px;">' + f.bags + ' bags of ' + f.kg + ' kg, ' + f.supplier + '</div>' +
        '<div class="text-center text-xs text-secondary" style="font-size:12px;">' + kg.toLocaleString() + ' kg</div>' +
        '<div style="grid-column:1/3;height:6px;border-radius:3px;background:var(--ff-pale);overflow:hidden;margin-top:4px;">' +
          '<span style="display:block;height:100%;width:' + Math.min(100, days / 30 * 100) + '%;background:' +
          (f.low ? '#e08a16' : 'linear-gradient(90deg,var(--ff-bright),var(--ff-teal))') + ';"></span>' +
        '</div></div>';
    }).join('');

    var max = Math.max.apply(null, DATA.feedTrend);
    document.getElementById('bars').innerHTML = DATA.feedTrend.map(function (v, i) {
      return '<div><b style="font-size:11.5px;">' + v + '</b>' +
        '<i style="height:' + Math.round(v / max * 110) + 'px"></i>' +
        '<span>' + DATA.days[i] + '</span></div>';
    }).join('');

    document.getElementById('week').textContent =
      DATA.feedTrend.reduce(function (a, b) { return a + b; }, 0).toLocaleString() + ' kg out this week';

    var session = document.getElementById('session');

    function paint() {
      var want = session.value;
      var rows = DATA.feedings.filter(function (f) {
        return want === 'All sessions' || f.session === want;
      });

      document.getElementById('rows').innerHTML = rows.length ? rows.map(function (f) {
        var c = DATA.cage(f.cage);
        return '<tr>' +
          '<td><span class="badge badge-sm bg-gradient-info">' + f.session + '</span></td>' +
          '<td><strong>' + f.cage + '</strong></td>' +
          '<td>' + (c ? c.species : '') + '</td>' +
          '<td>' + f.feed + '</td>' +
          '<td class="text-center text-sm">' + f.kg + ' kg</td>' +
          '<td class="text-center text-xs text-secondary">' + (c && c.stock ? (f.kg / c.stock * 1000).toFixed(1) + ' kg' : '-') + '</td>' +
          '<td class="text-xs text-secondary">' + f.by + '</td>' +
          '</tr>';
      }).join('') : '<tr><td colspan="7" class="text-xs text-secondary" style="padding:26px;text-align:center;">No round logged for that session yet.</td></tr>';
    }

    session.addEventListener('change', paint);
    paint();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
</head>
<body data-page="inventory" data-title="Inventory" data-sub="Records">

  <div id="content">
    <div class="card">
      <div class="card-head">
        <div><h2>Store room</h2><p>Supplement, medicine and vaccine, each with its own expiry</p></div>
        <div style="display:flex;gap:6px;" id="tabs">
          <button type="button" class="btn ghost sm on" data-kind="All">All</button>
          <button type="button" class="btn ghost sm" data-kind="Supplement">Supplement</button>
          <button type="button" class="btn ghost sm" data-kind="Medicine">Medicine</button>
          <button type="button" class="btn ghost sm" data-kind="Vaccine">Vaccine</button>
        </div>
      </div>
      <div class="wrap">
        <table>
          <thead><tr><th>Kind</th><th>Item</th><th class="num">On hand</th><th>Expires</th><th>Level</th><th style="text-align:right;">Action</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h2>Treatments running</h2><p>What is being dosed, and where</p></div></div>
      <div class="wrap">
        <table>
          <thead><tr><th>Cage</th><th>Species</th><th>Treatment</th><th>Started</th><th>Course</th><th>State</th></tr></thead>
          <tbody id="treat"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    'use strict';

    var want = 'All';

    function paint() {
      document.getElementById('rows').innerHTML = DATA.stores.filter(function (s) {
        return want === 'All' || s.kind === want;
      }).map(function (s) {
        return '<tr>' +
          '<td><span class="pill">' + s.kind + '</span></td>' +
          '<td><strong>' + s.name + '</strong></td>' +
          '<td class="num">' + s.qty.toLocaleString() + ' ' + s.unit + '</td>' +
          '<td class="dim">' + s.expires + '</td>' +
          '<td>' + (s.low ? '<span class="pill warn">Running low</span>' : '<span class="pill good">Stocked</span>') + '</td>' +
          '<td style="text-align:right;">' + (s.low
            ? '<button type="button" class="btn sm" data-order="' + s.name + '">Order</button>'
            : '<span class="dim" style="font-size:12px;">-</span>') + '</td>' +
          '</tr>';
      }).join('');
    }

    document.getElementById('tabs').addEventListener('click', function (event) {
      var btn = event.target.closest('[data-kind]');
      if (!btn) return;
      want = btn.dataset.kind;
      Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      paint();
    });

    document.getElementById('rows').addEventListener('click', function (event) {
      var btn = event.target.closest('[data-order]');
      if (btn) window.flash('Purchase request raised for ' + btn.dataset.order + '.');
    });

    paint();

    document.getElementById('treat').innerHTML = [
      { cage: 'C1', drug: 'Formalin bath, 200 ppm', started: 'Today 06:40', course: '3 days, one bath a day', state: 'Running' },
      { cage: 'C1', drug: 'Oxytetracycline in feed', started: 'Today 07:30', course: '7 days', state: 'Running' },
      { cage: 'H1', drug: 'Praziquantel bath', started: '6 days ago', course: '2 days', state: 'Finished' }
    ].map(function (t) {
      var c = DATA.cage(t.cage);
      return '<tr>' +
        '<td><strong>' + t.cage + '</strong> <span class="dim">Farm ' + c.farm + '</span></td>' +
        '<td>' + c.species + '</td>' +
        '<td>' + t.drug + '</td>' +
        '<td class="dim">' + t.started + '</td>' +
        '<td class="dim">' + t.course + '</td>' +
        '<td>' + (t.state === 'Running' ? '<span class="pill warn">Running</span>' : '<span class="pill good">Finished</span>') + '</td>' +
        '</tr>';
    }).join('');
  </script>
</body>
</html>

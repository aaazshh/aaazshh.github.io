<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="inventory" data-title="Inventory" data-crumb="Inventory">

  <div id="content">
    <div class="card mb-4">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Store room</h6><p class="text-sm text-secondary mb-0">Supplement, medicine and vaccine, each with its own expiry</p></div>
        <div style="display:flex;gap:6px;" id="tabs">
          <button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-kind="All">All</button>
          <button type="button" class="btn btn-sm btn-outline-primary mb-0" data-kind="Supplement">Supplement</button>
          <button type="button" class="btn btn-sm btn-outline-primary mb-0" data-kind="Medicine">Medicine</button>
          <button type="button" class="btn btn-sm btn-outline-primary mb-0" data-kind="Vaccine">Vaccine</button>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Kind</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Item</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">On hand</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Expires</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Level</th><th style="text-align:right;">Action</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2"><div><h6 class="mb-1">Treatments running</h6><p class="text-sm text-secondary mb-0">What is being dosed, and where</p></div></div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Species</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Treatment</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Started</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Course</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">State</th></tr></thead>
          <tbody id="treat"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    var want = 'All';

    function paint() {
      document.getElementById('rows').innerHTML = DATA.stores.filter(function (s) {
        return want === 'All' || s.kind === want;
      }).map(function (s) {
        return '<tr>' +
          '<td><span class="badge badge-sm bg-gradient-info">' + s.kind + '</span></td>' +
          '<td><strong>' + s.name + '</strong></td>' +
          '<td class="text-center text-sm">' + s.qty.toLocaleString() + ' ' + s.unit + '</td>' +
          '<td class="text-xs text-secondary">' + s.expires + '</td>' +
          '<td>' + (s.low ? '<span class="badge badge-sm bg-gradient-warning">Running low</span>' : '<span class="badge badge-sm bg-gradient-success">Stocked</span>') + '</td>' +
          '<td style="text-align:right;">' + (s.low
            ? '<button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-order="' + s.name + '">Order</button>'
            : '<span class="text-xs text-secondary" style="font-size:12px;">-</span>') + '</td>' +
          '</tr>';
      }).join('');
    }

    document.getElementById('tabs').addEventListener('click', function (event) {
      var btn = event.target.closest('[data-kind]');
      if (!btn) return;
      want = btn.dataset.kind;
      Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      paint();
    });

    document.getElementById('rows').addEventListener('click', function (event) {
      var btn = event.target.closest('[data-order]');
      if (btn) window.flash('Purchase request raised for ' + btn.dataset.order + '.');
    });

    paint();

    document.getElementById('treat').innerHTML = [
      { cage: 'C1', drug: 'Formalin bath, 200 ppm', started: 'Today 06:40', course: '3 days, one bath a day', state: 'Running' },
      { cage: 'C1', drug: 'Oxytetracycline in feed', started: 'Today 07:30', course: '7 days', state: 'Running' },
      { cage: 'H1', drug: 'Praziquantel bath', started: '6 days ago', course: '2 days', state: 'Finished' }
    ].map(function (t) {
      var c = DATA.cage(t.cage);
      return '<tr>' +
        '<td><strong>' + t.cage + '</strong> <span class="text-xs text-secondary">Farm ' + c.farm + '</span></td>' +
        '<td>' + c.species + '</td>' +
        '<td>' + t.drug + '</td>' +
        '<td class="text-xs text-secondary">' + t.started + '</td>' +
        '<td class="text-xs text-secondary">' + t.course + '</td>' +
        '<td>' + (t.state === 'Running' ? '<span class="badge badge-sm bg-gradient-warning">Running</span>' : '<span class="badge badge-sm bg-gradient-success">Finished</span>') + '</td>' +
        '</tr>';
    }).join('');
  </script>
</body>
</html>

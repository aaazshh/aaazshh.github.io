<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew app, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* The crew app is Flutter, so this follows Material: the farm's ocean brand,
       Roboto, cards, a bottom bar, and the queue that lets the pontoon log work
       with no signal. */
    :root {
      --deep: #14476e;
      --teal: #0b6e8f;
      --bright: #11a8b5;
      --ink: #172b3a;
      --muted: #6b8296;
      --line: #e3ecf1;
      --bg: #f2f7f9;
      --good: #17a67b;
      --warn: #d98a16;
      --bad: #c9403c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Roboto, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }

    .appbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 12px;
      background: linear-gradient(120deg, var(--deep), var(--teal));
      color: #fff;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.22);
    }
    .appbar h1 { margin: 0; font-size: 16.5px; font-weight: 500; }
    .appbar .sub { font-size: 11.5px; opacity: 0.85; margin-top: 1px; }
    .iconbtn {
      flex: none;
      display: grid; place-items: center;
      width: 34px; height: 34px;
      border: 0; border-radius: 50%;
      background: none; color: #fff;
      cursor: pointer;
    }
    .iconbtn:active { background: rgb(255 255 255 / 0.2); }
    .iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .back { display: none; }
    .has-back .back { display: grid; }
    .queue-dot {
      position: absolute;
      margin: -14px 0 0 16px;
      min-width: 17px; height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--warn);
      color: #fff;
      font-size: 10.5px; font-weight: 700; line-height: 17px;
      text-align: center;
    }

    .body { position: relative; flex: 1; overflow-y: auto; }
    .view { display: none; }
    .view.is-on { display: block; }
    .pad { padding: 14px; }

    /* Sign in */
    .signin { min-height: 100%; display: grid; align-content: center; gap: 20px; padding: 30px 26px; background: #fff; }
    .signin .mark { display: grid; justify-items: center; gap: 8px; }
    .signin .mark .fish {
      width: 62px; height: 62px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--teal), var(--bright));
      color: #fff;
    }
    .signin .mark b { font-size: 19px; }
    .signin .mark span { font-size: 12.5px; color: var(--muted); }

    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 11.5px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .field textarea {
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      font-size: 15px;
    }
    .field textarea { resize: none; min-height: 74px; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--bright); outline-offset: -1px; }

    /* Weather, straight off the home screen of the real app */
    .weather {
      margin: 14px 14px 0;
      padding: 15px 16px;
      border-radius: 14px;
      background: linear-gradient(120deg, var(--deep), #2f7fb0);
      color: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px;
    }
    .weather b { grid-area: 1 / 1; font-size: 21px; font-weight: 700; }
    .weather .place { grid-area: 2 / 1; font-size: 12.5px; opacity: 0.88; }
    .weather .cond { grid-area: 1 / 2 / 3 / 3; align-self: center; text-align: right; font-size: 12.5px; opacity: 0.92; }
    .weather .strip { grid-area: 3 / 1 / 4 / 3; display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 11.5px; opacity: 0.9; }

    .section { padding: 18px 16px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

    .cages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 14px; }
    .cagebtn {
      display: grid; gap: 2px;
      padding: 12px 8px;
      border: 0; border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 3px rgb(20 71 110 / 0.14);
      cursor: pointer;
      text-align: center;
    }
    .cagebtn b { font-size: 16px; }
    .cagebtn span { font-size: 11px; color: var(--muted); }
    .cagebtn i { display: block; height: 3px; border-radius: 2px; background: var(--teal); margin-top: 6px; }
    .cagebtn.warn i { background: var(--warn); }
    .cagebtn.bad i { background: var(--bad); }
    .cagebtn.empty i { background: #c3ccd4; }

    .card { background: #fff; border-radius: 13px; box-shadow: 0 1px 3px rgb(20 71 110 / 0.13); overflow: hidden; }
    .card + .card { margin-top: 12px; }
    .card h2 { margin: 0; padding: 14px 16px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .rows { padding: 0 0 8px; }
    .row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 16px; font-size: 14px; }
    .row span:last-child { color: var(--muted); text-align: right; }

    .ops { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px; }
    .op {
      display: grid; justify-items: center; gap: 7px;
      padding: 15px 8px;
      border: 0; border-radius: 13px;
      background: #fff;
      box-shadow: 0 1px 3px rgb(20 71 110 / 0.13);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
    }
    .op:active { background: #eaf4f8; }
    .op .ic {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--teal), var(--bright));
      color: #fff;
    }
    .op .ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .op.red .ic { background: linear-gradient(135deg, #a93a36, #d3605c); }
    .op.amber .ic { background: linear-gradient(135deg, #b8770f, #e0a33c); }

    .btn {
      width: 100%;
      padding: 14px 16px;
      border: 0; border-radius: 9px;
      background: var(--teal);
      color: #fff;
      font-size: 14px; font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.18);
    }
    .btn:active { background: var(--deep); }
    .btn.ghost { background: #fff; color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
    .btn[disabled] { background: #dde3e8; color: #96a3ad; box-shadow: none; }
    .actions { display: grid; gap: 10px; padding: 0 14px 18px; }

    /* Scanner */
    .scan { position: absolute; inset: 0; background: #0d1b26; display: grid; place-items: center; }
    .viewer {
      position: relative;
      width: 74%; aspect-ratio: 1;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 40%, #1d3a4c, #0d1b26 70%);
      overflow: hidden;
      box-shadow: 0 0 0 100vmax rgb(13 27 38 / 0.72);
    }
    .viewer::before, .viewer::after {
      content: "";
      position: absolute;
      width: 34px; height: 34px;
      border: 3px solid var(--bright);
    }
    .viewer::before { top: 12px; left: 12px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
    .viewer::after { bottom: 12px; right: 12px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
    .laser {
      position: absolute;
      left: 8%; right: 8%;
      height: 2px;
      background: var(--bright);
      box-shadow: 0 0 12px 2px rgb(17 168 181 / 0.8);
      animation: sweep 1.6s ease-in-out infinite;
    }
    @keyframes sweep { 0%, 100% { top: 16%; } 50% { top: 84%; } }
    .scan .hint { position: absolute; bottom: 42px; left: 0; right: 0; text-align: center; color: #cfe4ec; font-size: 13px; }
    .scan .cancel { position: absolute; top: 16px; right: 16px; }

    /* Log list */
    .entry {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 2px 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .entry .dot {
      grid-area: 1 / 1 / 3 / 2;
      width: 30px; height: 30px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: #e6f2f7;
      color: var(--teal);
    }
    .entry .dot svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .entry b { grid-area: 1 / 2; font-size: 14px; font-weight: 500; }
    .entry .meta { grid-area: 2 / 2; font-size: 12.5px; color: var(--muted); }
    .entry .tag { grid-area: 1 / 3 / 3 / 4; align-self: center; }

    .tag {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      background: #e8f5ef;
      color: #0f7a59;
      white-space: nowrap;
    }
    .tag.queued { background: #fdf0d8; color: #9c6408; }

    .banner {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      background: #fdf0d8;
      color: #8a5c08;
      font-size: 12.5px;
    }
    .banner button { margin-left: auto; border: 0; background: none; color: #8a5c08; font-weight: 700; font-size: 12.5px; cursor: pointer; }

    .photos { display: flex; gap: 8px; padding: 0 0 14px; }
    .photo {
      width: 62px; height: 62px;
      border-radius: 10px;
      background: linear-gradient(135deg, #cfe3ec, #9dc4d6);
      display: grid; place-items: center;
      color: var(--deep);
      font-size: 10.5px;
    }
    .photo.add { background: #fff; border: 1px dashed #bcccd6; color: var(--muted); cursor: pointer; }

    .navbar {
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .navbar button {
      padding: 9px 0 10px;
      border: 0; background: none;
      color: var(--muted);
      font-size: 11px; font-weight: 500;
      display: grid; justify-items: center; gap: 3px;
      cursor: pointer;
    }
    .navbar button.is-on { color: var(--teal); }
    .navbar svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .navbar[hidden], .appbar[hidden], .banner[hidden] { display: none; }

    .toast {
      position: fixed;
      left: 14px; right: 14px; bottom: 74px;
      z-index: 90;
      padding: 12px 14px;
      border-radius: 9px;
      background: #223240;
      color: #f2f8fb;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <header class="appbar" id="appbar" hidden>
    <button class="iconbtn back" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </button>
    <div style="flex:1;min-width:0;">
      <h1 id="title">Farm 1</h1>
      <div class="sub" id="sub">guest8</div>
    </div>
    <button class="iconbtn" id="signal" aria-label="Connection">
      <svg viewBox="0 0 24 24" id="signal-on"><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 16a5 5 0 0 1 7 0"></path><path d="M12 19.5h.01"></path></svg>
      <svg viewBox="0 0 24 24" id="signal-off" hidden><path d="M2 2l20 20"></path><path d="M8.5 16a5 5 0 0 1 5.6-1"></path><path d="M12 19.5h.01"></path></svg>
    </button>
  </header>

  <div class="body" id="body">

    <section class="view is-on" id="view-signin">
      <form class="signin" id="signin-form">
        <div class="mark">
          <span class="fish">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3.5-5 8-7 12-7 2.7 0 4.6 1 6 2-1.4 1-3.3 2-6 2"></path><path d="M3 12c3.5 5 8 7 12 7 2.7 0 4.6-1 6-2-1.4-1-3.3-2-6-2"></path><circle cx="16.5" cy="10" r="0.9" fill="currentColor"></circle></svg>
          </span>
          <b>Fish Farm</b>
          <span>Crew app</span>
        </div>
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" type="email" value="siti.n@primefishfarm.sg" autocomplete="off">
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" value="..........." autocomplete="off">
        </div>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </section>

    <section class="view" id="view-home">
      <div class="banner" id="offline-banner" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l20 20"></path><path d="M12 19.5h.01"></path></svg>
        <span id="queue-note"></span>
        <button type="button" id="sync-now">Sync</button>
      </div>

      <div class="weather">
        <b>29&deg;C</b>
        <span class="cond">Scattered showers<br>Wind 14 km/h SW</span>
        <span class="place">West Johor Strait, farm 1</span>
        <div class="strip">
          <span>Tide high 11:20</span>
          <span>Low 17:45</span>
          <span>Swell 0.4 m</span>
        </div>
      </div>

      <div class="section">Cages, farm 1</div>
      <div class="cages" id="cages"></div>

      <div class="actions" style="padding-top:16px;">
        <button type="button" class="btn" id="scan-btn">Scan a cage</button>
      </div>
    </section>

    <section class="view" id="view-scan">
      <div class="scan">
        <div class="viewer"><div class="laser"></div></div>
        <div class="hint" id="scan-hint">Point at the tag on the walkway rail</div>
        <button type="button" class="btn ghost" id="scan-cancel" style="position:absolute;bottom:88px;left:50%;transform:translateX(-50%);width:auto;padding:10px 22px;">Cancel</button>
      </div>
    </section>

    <section class="view" id="view-cage"></section>

    <section class="view" id="view-form"></section>

    <section class="view" id="view-log">
      <div id="log-list"></div>
    </section>

  </div>

  <nav class="navbar" id="navbar" hidden>
    <button class="is-on" data-go="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>
      Farm
    </button>
    <button data-go="scan">
      <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M4 12h16"></path></svg>
      Scan
    </button>
    <button data-go="log">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-7-3-7 3z"></path></svg>
      My log
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    'use strict';

    var ICON = {
      feed: '<path d="M5 7h14l-1.2 12.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8z"></path><path d="M9 7V5a3 3 0 0 1 6 0v2"></path>',
      dead: '<circle cx="12" cy="12" r="9"></circle><path d="m9 9 2.5 2.5M14.5 9 12 11.5"></path><path d="M9 16h6"></path>',
      net: '<path d="M4 4h16v16H4z"></path><path d="M4 9h16M4 14h16M9 4v16M14 4v16"></path>',
      harvest: '<path d="M4 9h16l-1.5 10.2a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8z"></path><path d="m8 9 3-6M16 9l-3-6"></path>',
      treat: '<path d="M12 3s6 6.4 6 10.5A6 6 0 0 1 6 13.5C6 9.4 12 3 12 3z"></path>',
      alert: '<path d="M10.3 3.9 2.3 18a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v5M12 17.5h.01"></path>'
    };

    var me = 'Siti';
    var here = 'signin';
    var cageName = 'A1';
    var online = true;
    var log = [];        // what this phone has recorded today
    var queue = 0;       // entries waiting for signal

    var el = {
      appbar: document.getElementById('appbar'),
      navbar: document.getElementById('navbar'),
      title: document.getElementById('title'),
      sub: document.getElementById('sub'),
      banner: document.getElementById('offline-banner')
    };

    function show(name, opts) {
      opts = opts || {};
      here = name;
      Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) {
        v.classList.toggle('is-on', v.id === 'view-' + name);
      });
      var chrome = name !== 'signin' && name !== 'scan';
      el.appbar.hidden = !chrome;
      el.navbar.hidden = !chrome || name === 'cage' || name === 'form';
      el.appbar.classList.toggle('has-back', name === 'cage' || name === 'form');
      el.title.textContent = opts.title || 'Farm 1';
      el.sub.textContent = opts.sub || 'guest8';
      document.getElementById('body').scrollTop = 0;
      if (name === 'log') paintLog();
      if (name === 'home') paintHome();
    }

    function toast(text) {
      var t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(t.timer);
      t.timer = setTimeout(function () { t.classList.remove('show'); }, 3200);
    }

    function now() {
      var d = new Date();
      return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    }

    /* Home ----------------------------------------------------------------- */

    var TONE = { 'Growing': '', 'Near harvest': '', 'Net repair': 'warn', 'Treatment': 'bad', 'Empty': 'empty' };

    function paintHome() {
      document.getElementById('cages').innerHTML = DATA.cages.filter(function (c) {
        return c.farm === 1;
      }).map(function (c) {
        return '<button type="button" class="cagebtn ' + TONE[c.status] + '" data-cage="' + c.name + '">' +
          '<b>' + c.name + '</b>' +
          '<span>' + (c.stock ? (c.stock / 1000).toFixed(1) + 'k fish' : 'empty') + '</span>' +
          '<i></i></button>';
      }).join('');

      el.banner.hidden = queue === 0;
      document.getElementById('queue-note').textContent =
        queue + ' record' + (queue === 1 ? '' : 's') + ' waiting for signal';
    }

    /* Cage ----------------------------------------------------------------- */

    function openCage(name) {
      cageName = name;
      var c = DATA.cage(name);
      var f = c.species ? DATA.fish(c.species) : null;
      var mine = log.filter(function (l) { return l.cage === name; });

      document.getElementById('view-cage').innerHTML =
        '<div class="pad">' +
          '<div class="card">' +
            '<h2>Cage ' + c.name + ', farm ' + c.farm + '</h2>' +
            '<div class="rows">' +
              (c.stock
                ? '<div class="row"><span>Species</span><span>' + c.species + ' ' + f.cn + '</span></div>' +
                  '<div class="row"><span>Stock</span><span>' + c.stock.toLocaleString() + ' fish</span></div>' +
                  '<div class="row"><span>Average weight</span><span>' + c.avg.toFixed(2) + ' kg</span></div>' +
                  '<div class="row"><span>Stocked</span><span>' + c.stocked + '</span></div>' +
                  '<div class="row"><span>Status</span><span>' + c.status + '</span></div>'
                : '<div class="row"><span>Status</span><span>Empty, fallowing</span></div>') +
            '</div>' +
          '</div>' +
          (mine.length ? '<div class="card"><h2>Logged here today</h2><div class="rows">' +
            mine.map(function (l) {
              return '<div class="row"><span>' + l.what + '</span><span>' + l.at + '</span></div>';
            }).join('') + '</div></div>' : '') +
        '</div>' +
        '<div class="ops">' +
          '<button type="button" class="op" data-form="feed"><span class="ic"><svg viewBox="0 0 24 24">' + ICON.feed + '</svg></span>Feeding</button>' +
          '<button type="button" class="op red" data-form="dead"><span class="ic"><svg viewBox="0 0 24 24">' + ICON.dead + '</svg></span>Dead fish</button>' +
          '<button type="button" class="op" data-form="net"><span class="ic"><svg viewBox="0 0 24 24">' + ICON.net + '</svg></span>Net work</button>' +
          '<button type="button" class="op" data-form="harvest"><span class="ic"><svg viewBox="0 0 24 24">' + ICON.harvest + '</svg></span>Harvest</button>' +
          '<button type="button" class="op" data-form="treat"><span class="ic"><svg viewBox="0 0 24 24">' + ICON.treat + '</svg></span>Treatment</button>' +
          '<button type="button" class="op amber" data-form="incident"><span class="ic"><svg viewBox="0 0 24 24">' + ICON.alert + '</svg></span>Incident</button>' +
        '</div>';

      show('cage', { title: 'Cage ' + c.name, sub: c.stock ? c.species : 'Empty' });
    }

    /* Forms ---------------------------------------------------------------- */

    var FORMS = {
      feed: {
        title: 'Feeding',
        icon: 'feed',
        fields: [
          { k: 'session', label: 'Session', type: 'select', options: ['Morning', 'Noon', 'Evening'] },
          { k: 'feed', label: 'Feed', type: 'select', options: DATA.feeds.map(function (f) { return f.name; }) },
          { k: 'kg', label: 'Kilos', type: 'number', value: '60' },
          { k: 'note', label: 'Remarks', type: 'text' }
        ],
        line: function (v) { return 'Fed ' + v.kg + ' kg of ' + v.feed + ', ' + v.session.toLowerCase(); }
      },
      dead: {
        title: 'Dead fish',
        icon: 'dead',
        photos: true,
        fields: [
          { k: 'count', label: 'How many', type: 'number', value: '8' },
          { k: 'sign', label: 'Clinical sign', type: 'select', options: ['None noted', 'Skin lesions', 'Gill pale', 'Eye cloudy', 'Fin rot', 'Bloated'] },
          { k: 'diag', label: 'Clinical diagnosis', type: 'select', options: ['Not sent', 'Sent for lab diagnosis'] },
          { k: 'note', label: 'Remarks', type: 'text' }
        ],
        line: function (v) { return v.count + ' dead, ' + v.sign.toLowerCase(); }
      },
      net: {
        title: 'Net work',
        icon: 'net',
        photos: true,
        fields: [
          { k: 'kind', label: 'What was done', type: 'select', options: ['Wash net', 'Change net', 'Report broken net'] },
          { k: 'size', label: 'Net size', type: 'select', options: ['4 x 4 x 4 m', '5 x 5 x 4 m', '6 x 6 x 5 m'] },
          { k: 'note', label: 'Remarks', type: 'text' }
        ],
        line: function (v) { return v.kind + ', ' + v.size; }
      },
      harvest: {
        title: 'Harvest',
        icon: 'harvest',
        fields: [
          { k: 'kg', label: 'Weight out', type: 'number', value: '220' },
          { k: 'pcs', label: 'Pieces', type: 'number', value: '260' },
          { k: 'cond', label: 'Condition', type: 'select', options: ['Live', 'Ice chilled'] },
          { k: 'buyer', label: 'Buyer', type: 'select', options: ['Prime Supermarket', 'Jurong Fishery Port', 'Restaurant group'] }
        ],
        line: function (v) { return 'Harvested ' + v.kg + ' kg, ' + v.cond.toLowerCase(); }
      },
      treat: {
        title: 'Treatment',
        icon: 'treat',
        fields: [
          { k: 'drug', label: 'Treatment', type: 'select', options: ['Formalin bath', 'Oxytetracycline in feed', 'Praziquantel bath', 'Vitamin C premix'] },
          { k: 'dose', label: 'Dose', type: 'text', value: '200 ppm' },
          { k: 'note', label: 'Remarks', type: 'text' }
        ],
        line: function (v) { return v.drug + ', ' + v.dose; }
      },
      incident: {
        title: 'Raise an incident',
        icon: 'alert',
        photos: true,
        fields: [
          { k: 'kind', label: 'Type', type: 'select', options: ['Mortality spike', 'Broken net', 'Low oxygen', 'Boat damage', 'Other'] },
          { k: 'note', label: 'What happened', type: 'area' }
        ],
        line: function (v) { return 'Incident raised, ' + v.kind.toLowerCase(); }
      }
    };

    function openForm(kind) {
      var form = FORMS[kind];
      var c = DATA.cage(cageName);

      document.getElementById('view-form').innerHTML =
        '<div class="pad">' +
          '<div class="card"><div class="rows" style="padding-top:12px;">' +
            '<div class="row"><span>Cage</span><span>' + c.name + ', farm ' + c.farm + '</span></div>' +
            (c.species ? '<div class="row"><span>Species</span><span>' + c.species + '</span></div>' : '') +
            '<div class="row"><span>Logged by</span><span>' + me + ', ' + now() + '</span></div>' +
          '</div></div>' +
          '<div class="card" style="padding:14px 16px 4px;">' +
            form.fields.map(function (f) {
              if (f.type === 'select') {
                return '<div class="field"><label for="f-' + f.k + '">' + f.label + '</label>' +
                  '<select id="f-' + f.k + '">' + f.options.map(function (o) {
                    return '<option>' + o + '</option>';
                  }).join('') + '</select></div>';
              }
              if (f.type === 'area') {
                return '<div class="field"><label for="f-' + f.k + '">' + f.label + '</label>' +
                  '<textarea id="f-' + f.k + '" placeholder="Keep it short, the office reads these"></textarea></div>';
              }
              return '<div class="field"><label for="f-' + f.k + '">' + f.label + '</label>' +
                '<input id="f-' + f.k + '" type="' + (f.type === 'number' ? 'number' : 'text') + '" value="' + (f.value || '') + '"' +
                (f.type === 'text' ? ' placeholder="Optional"' : '') + '></div>';
            }).join('') +
            (form.photos
              ? '<div class="field"><label>Photos</label><div class="photos" id="photos">' +
                '<button type="button" class="photo add" id="add-photo">Add</button></div></div>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn" id="save">Save ' + form.title.toLowerCase() + '</button>' +
          '<button type="button" class="btn ghost" data-act="back-cage">Cancel</button>' +
        '</div>';

      show('form', { title: form.title, sub: 'Cage ' + c.name });

      var shots = 0;
      var add = document.getElementById('add-photo');
      if (add) {
        add.addEventListener('click', function () {
          shots += 1;
          var p = document.createElement('span');
          p.className = 'photo';
          p.textContent = 'IMG ' + shots;
          document.getElementById('photos').insertBefore(p, add);
          if (shots >= 3) add.remove();
        });
      }

      document.getElementById('save').addEventListener('click', function () {
        var values = {};
        form.fields.forEach(function (f) {
          values[f.k] = document.getElementById('f-' + f.k).value;
        });

        if (kind === 'incident' && !values.note.trim()) {
          toast('Say what happened before sending it.');
          return;
        }

        log.unshift({
          cage: cageName,
          what: form.line(values),
          icon: form.icon,
          at: now(),
          synced: online,
          photos: shots
        });

        if (!online) queue += 1;

        show('home');
        toast(online
          ? form.title + ' saved. It is on the portal already.'
          : form.title + ' saved on the phone. It goes up when the signal comes back.');
      });
    }

    /* Scanner -------------------------------------------------------------- */

    function startScan() {
      show('scan');
      document.getElementById('scan-hint').textContent = 'Point at the tag on the walkway rail';
      clearTimeout(startScan.timer);
      startScan.timer = setTimeout(function () {
        if (here !== 'scan') return;
        var pool = DATA.cages.filter(function (c) { return c.farm === 1 && c.stock > 0; });
        var found = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('scan-hint').textContent = 'Cage ' + found.name + ' found';
        setTimeout(function () {
          if (here === 'scan') openCage(found.name);
        }, 450);
      }, 1700);
    }

    /* My log --------------------------------------------------------------- */

    function paintLog() {
      var list = document.getElementById('log-list');
      if (!log.length) {
        list.innerHTML = '<p style="padding:40px 26px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;">' +
          'Nothing logged yet. Open a cage and record a feeding, a count or a net job.</p>';
        return;
      }
      list.innerHTML = log.map(function (l) {
        return '<div class="entry">' +
          '<span class="dot"><svg viewBox="0 0 24 24">' + ICON[l.icon] + '</svg></span>' +
          '<b>' + l.what + '</b>' +
          '<span class="meta">Cage ' + l.cage + ', ' + l.at + (l.photos ? ', ' + l.photos + ' photo' + (l.photos > 1 ? 's' : '') : '') + '</span>' +
          '<span class="tag ' + (l.synced ? '' : 'queued') + '">' + (l.synced ? 'Synced' : 'Queued') + '</span>' +
          '</div>';
      }).join('');
    }

    /* Wiring --------------------------------------------------------------- */

    document.getElementById('signin-form').addEventListener('submit', function (event) {
      event.preventDefault();
      show('home');
      toast('Signed in. Farm 1 is yours today.');
    });

    document.getElementById('body').addEventListener('click', function (event) {
      var cage = event.target.closest('[data-cage]');
      if (cage) { openCage(cage.dataset.cage); return; }

      var form = event.target.closest('[data-form]');
      if (form) { openForm(form.dataset.form); return; }

      if (event.target.closest('[data-act="back-cage"]')) openCage(cageName);
    });

    document.getElementById('scan-btn').addEventListener('click', startScan);
    document.getElementById('scan-cancel').addEventListener('click', function () { show('home'); });

    document.getElementById('back').addEventListener('click', function () {
      if (here === 'form') openCage(cageName);
      else show('home');
    });

    document.getElementById('navbar').addEventListener('click', function (event) {
      var btn = event.target.closest('[data-go]');
      if (!btn) return;
      Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('is-on'); });
      btn.classList.add('is-on');
      if (btn.dataset.go === 'scan') startScan();
      else show(btn.dataset.go, { title: btn.dataset.go === 'log' ? 'My log' : 'Farm 1' });
    });

    // The pontoon has no signal half the time, so the app keeps working and
    // pushes what it has when the bars come back.
    document.getElementById('signal').addEventListener('click', function () {
      online = !online;
      document.getElementById('signal-on').hidden = !online;
      document.getElementById('signal-off').hidden = online;
      if (online) sync();
      else toast('Offline. Records stay on the phone until there is signal.');
      paintHome();
    });

    function sync() {
      if (!queue) { toast('Back online, nothing waiting.'); return; }
      var n = queue;
      log.forEach(function (l) { l.synced = true; });
      queue = 0;
      paintHome();
      if (here === 'log') paintLog();
      toast(n + ' record' + (n === 1 ? '' : 's') + ' pushed to the portal.');
    }

    document.getElementById('sync-now').addEventListener('click', function () {
      if (!online) { toast('Still no signal. It will go up on its own.'); return; }
      sync();
    });

    paintHome();
  </script>
</body>
</html>

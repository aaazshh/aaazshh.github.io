<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew app, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* The crew app is Flutter and follows its own theme rather than the
       portal's: Argon indigo rather than the portal's teal re-skin, Material
       shapes, and the reef painted behind every screen. Colours and metrics
       come straight from lib/fishfarm_theme.dart. */
    :root {
      --primary: #5E72E4;
      --primary-dark: #324380;
      --primary-light: #E8ECFD;
      --primary-pressed: #4B5CBC;
      --ink: #202124;
      --ink2: #344767;
      --muted: #67748E;
      --line: #E0E3F0;
      --surface: #ffffff;
      --bg: #F8F9FA;
      --danger: #F5365C;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Roboto, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }

    /* The reef, the same canvas port the portal uses, but animated and
       interactive here the way FishBackground is on the phone. */
    #reef {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .body { position: relative; z-index: 1; flex: 1; overflow-y: auto; }
    .view { display: none; min-height: 100%; }
    .view.is-on { display: block; }

    /* ── Splash ──────────────────────────────────────────────────────────
       The Prime mark dissolving into a fish, the app's own opening. */
    .splash {
      position: absolute; inset: 0; z-index: 60;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      transition: opacity 600ms ease-in;
    }
    .splash.gone { opacity: 0; pointer-events: none; }
    .splash canvas { width: 220px; height: 220px; }
    .splash .word {
      position: absolute; left: 0; right: 0; bottom: 30%;
      text-align: center;
      color: #fff; font-size: 19px; font-weight: 700; letter-spacing: 0.06em;
      opacity: 0; transition: opacity 500ms ease 200ms;
    }
    .splash.named .word { opacity: 1; }

    /* ── Hero bar (FfHeroBar) ────────────────────────────────────────────
       Indigo gradient, a soft radial bloom top right, and a blurred circular
       back button. */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 14px 18px 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: flex; align-items: center; gap: 12px;
    }
    .hero::before {
      content: '';
      position: absolute; top: -20px; right: -20px;
      width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle, rgb(255 255 255 / 0.07), transparent 70%);
    }
    .hero > * { position: relative; }
    .hero-back {
      flex: none;
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: rgb(255 255 255 / 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff; cursor: pointer;
    }
    .hero-text { flex: 1; min-width: 0; }
    .hero-text b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.15; }
    .hero-text span { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 500; color: rgb(255 255 255 / 0.78); }
    .hero-trail { flex: none; font-size: 14px; font-weight: 700; color: #fff; background: none; border: 0; cursor: pointer; padding: 0 4px; }

    /* ── Sign in ─────────────────────────────────────────────────────── */
    .signin {
      min-height: 100%;
      display: grid; align-content: center; gap: 22px;
      padding: 36px 26px;
    }
    .signin-mark { display: grid; justify-items: center; gap: 12px; }
    .signin-mark .badge {
      width: 82px; height: 82px; border-radius: 26px;
      display: grid; place-items: center;
      background: #fff;
      box-shadow: 0 10px 28px rgb(94 114 228 / 0.28);
      color: var(--primary);
    }
    .signin-mark b { font-size: 23px; font-weight: 800; color: var(--ink2); letter-spacing: -0.3px; }
    .signin-mark span { font-size: 13px; color: var(--muted); }

    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .field .box { position: relative; }
    .field input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font: 400 15px Roboto, sans-serif;
      background: #fff;
      color: var(--ink);
    }
    .field input:focus { outline: 0; border-color: var(--primary); box-shadow: 0 0 0 3px rgb(94 114 228 / 0.14); }
    .field .lead {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: var(--primary); pointer-events: none;
    }
    .field .peek {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer;
    }
    .field .peek svg { width: 19px; height: 19px; }

    .btn {
      width: 100%; height: 52px;
      display: grid; place-items: center;
      border: 0; border-radius: 14px;
      background: var(--primary); color: #fff;
      font: 700 15.5px Roboto, sans-serif;
      box-shadow: 0 6px 18px rgb(94 114 228 / 0.3);
      cursor: pointer;
    }
    .btn:active { background: var(--primary-pressed); }
    .btn[disabled] { opacity: 0.6; cursor: default; }
    .btn.ghost { background: #fff; color: var(--ink2); border: 1.5px solid var(--line); box-shadow: none; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgb(255 255 255 / 0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 700ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Home ────────────────────────────────────────────────────────── */
    .home-top { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 14px 4px; }
    .round {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border: 1px solid rgb(255 255 255 / 0.9); border-radius: 50%;
      background: rgb(255 255 255 / 0.85);
      box-shadow: 0 4px 12px rgb(94 114 228 / 0.14);
      color: var(--ink2); cursor: pointer;
    }
    .round svg { width: 22px; height: 22px; }

    .greet { display: flex; align-items: center; gap: 14px; padding: 6px 20px 14px; }
    .greet .avatar {
      flex: none;
      width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center;
      background: #fff;
      border: 2px solid rgb(255 255 255 / 0.9);
      box-shadow: 0 4px 12px rgb(94 114 228 / 0.18);
      color: var(--muted);
    }
    .greet h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--ink2); letter-spacing: -0.4px; line-height: 1.1; }
    .greet p { margin: 3px 0 0; font-size: 14px; font-weight: 500; color: var(--muted); }

    .section-label {
      padding: 0 16px;
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted);
    }
    .module-card {
      margin: 12px 16px 28px;
      padding: 24px 12px;
      border: 1px solid rgb(255 255 255 / 0.9); border-radius: 24px;
      background: rgb(255 255 255 / 0.82);
      box-shadow: 0 12px 28px rgb(94 114 228 / 0.10);
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px 0; justify-items: center;
    }
    .module {
      display: grid; justify-items: center; gap: 10px;
      width: 130px;
      border: 0; background: none; cursor: pointer;
    }
    .module .label { font-size: 13px; font-weight: 600; color: var(--ink2); text-align: center; line-height: 1.2; }

    /* FfTile: a rounded square with a soft vertical gradient of its palette. */
    .tile {
      display: grid; place-items: center;
      border-radius: 28px;
    }
    .tile.lg { width: 104px; height: 104px; border-radius: 28px; }
    .tile.sm { width: 50px; height: 50px; border-radius: 14px; }
    .tile svg { width: 46px; height: 46px; }
    .tile.sm svg { width: 24px; height: 24px; }

    /* ── Cage detail ─────────────────────────────────────────────────── */
    .pad { padding: 16px 16px 28px; }
    .info {
      padding: 18px;
      border: 1px solid var(--line); border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 8px 18px rgb(0 0 0 / 0.05);
    }
    .info-top { display: flex; align-items: flex-start; gap: 8px; }
    .info-top .hash {
      flex: none;
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--primary); color: #fff;
    }
    .info-top .hash svg { width: 16px; height: 16px; }
    .info-top .ref { flex: 1; font-size: 18px; font-weight: 800; color: var(--primary); }
    .info-top .upd { text-align: right; }
    .info-top .upd small { display: block; font-size: 11px; color: var(--muted); }
    .info-top .upd b { font-size: 12px; font-weight: 600; color: var(--ink2); }
    .info hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
    .kv { display: flex; align-items: flex-start; gap: 12px; }
    .kv + .kv { margin-top: 8px; }
    .kv span { width: 92px; flex: none; font-size: 13.5px; color: var(--muted); }
    .kv b { flex: 1; text-align: right; font-size: 14px; font-weight: 600; color: var(--ink); }
    .stats {
      display: flex; margin-top: 16px; padding: 14px 0;
      border-radius: 14px; background: var(--bg);
    }
    .stats div { flex: 1; text-align: center; }
    .stats small { display: block; font-size: 11.5px; color: var(--muted); }
    .stats b { display: block; margin-top: 4px; font-size: 15px; font-weight: 800; color: var(--ink); }
    .stats i { width: 1px; height: 30px; align-self: center; background: var(--line); }

    .ops-title { margin: 22px 0 12px; font-size: 17px; font-weight: 800; color: var(--ink); }
    .ops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .op {
      display: grid; justify-items: center; gap: 10px;
      padding: 18px 6px;
      border: 1px solid var(--line); border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 6px 12px rgb(0 0 0 / 0.04);
      cursor: pointer;
    }
    .op .label { font-size: 12px; font-weight: 700; color: var(--ink2); text-align: center; line-height: 1.15; }

    /* ── Map ─────────────────────────────────────────────────────────── */
    .farmpick { display: flex; gap: 8px; padding: 14px 16px 0; }
    .farmpick button {
      flex: 1; padding: 9px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--ink2); font: 600 13px Roboto, sans-serif; cursor: pointer;
    }
    .farmpick button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .mapwrap { margin: 14px 16px 28px; padding: 16px; border-radius: 16px; background: #EBF0F8; }
    .mapgrid { position: relative; width: 100%; padding-top: 86%; }
    .cage {
      position: absolute;
      display: grid; place-content: center; justify-items: center;
      padding: 4px 3px;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.10);
      cursor: pointer;
      overflow: hidden;
    }
    .cage b { font-size: 13px; font-weight: 700; color: #000; }
    .cage small { font-size: 8.5px; color: #5A5B5C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .cage.empty { cursor: default; }

    /* ── Search ──────────────────────────────────────────────────────── */
    .searchbar { padding: 14px 16px 0; }
    .searchbar input {
      width: 100%; padding: 13px 14px;
      border: 1px solid var(--line); border-radius: 14px;
      font: 400 15px Roboto, sans-serif; background: #fff;
    }
    .searchbar input:focus { outline: 0; border-color: var(--primary); }
    .result {
      display: flex; align-items: center; gap: 12px;
      width: 100%; margin-bottom: 10px; padding: 14px;
      border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); text-align: left; cursor: pointer;
    }
    .result .ref { font-size: 15px; font-weight: 700; color: var(--primary); }
    .result .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .result .go { margin-left: auto; color: var(--muted); }

    /* ── Operation form (OpScaffold) ─────────────────────────────────── */
    .form-body { padding: 18px 18px 24px; }
    .flabel { margin-bottom: 7px; font-size: 13px; font-weight: 600; color: var(--ink2); }
    .flabel i { color: var(--danger); font-style: normal; }
    .fgap { height: 18px; }
    .finput, .fselect {
      width: 100%; padding: 13px 14px;
      border: 1px solid var(--line); border-radius: 14px;
      font: 400 15px Roboto, sans-serif; background: #fff; color: var(--ink);
    }
    .finput:focus, .fselect:focus { outline: 0; border-color: var(--primary); }
    textarea.finput { resize: none; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice {
      padding: 9px 16px;
      border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--ink2);
      font: 600 13px Roboto, sans-serif; cursor: pointer;
    }
    .choice.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .formbar {
      position: sticky; bottom: 0;
      padding: 12px 18px;
      background: var(--surface);
      box-shadow: 0 -4px 16px rgb(0 0 0 / 0.06);
    }

    /* ── Logout dialog ───────────────────────────────────────────────── */
    .scrim {
      position: fixed; inset: 0; z-index: 70;
      display: grid; place-items: center;
      padding: 28px;
      background: rgb(12 46 76 / 0.42);
      opacity: 0; pointer-events: none; transition: opacity 180ms ease;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .dialog {
      width: 100%; max-width: 320px;
      padding: 24px 22px 18px;
      border-radius: 22px; background: #fff; text-align: center;
    }
    .dialog h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; color: var(--ink2); }
    .dialog p { margin: 0 0 20px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
    .dialog .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dialog .pair .btn { height: 46px; font-size: 14.5px; }

    .toast {
      position: fixed; left: 14px; right: 14px; bottom: 22px; z-index: 80;
      padding: 12px 14px; border-radius: 12px;
      background: #2B3445; color: #f8fafc;
      font-size: 13px; line-height: 1.45;
      opacity: 0; transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>

  <canvas id="reef" aria-hidden="true"></canvas>

  <div class="splash" id="splash">
    <canvas id="splash-canvas" width="440" height="440"></canvas>
    <div class="word">FISH FARM</div>
  </div>

  <div class="body" id="body">

    <section class="view is-on" id="view-signin">
      <form class="signin" id="signin-form">
        <div class="signin-mark">
          <span class="badge">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 7c3 1 5 3 6 5-1 2-3 4-6 5-4 1-8-1-11-5 3-4 7-6 11-5Z"></path>
              <path d="m3 12-2-3v6l2-3Z"></path>
              <circle cx="17" cy="11" r="1" fill="currentColor"></circle>
            </svg>
          </span>
          <b>Fish Farm</b>
          <span>Field operations</span>
        </div>

        <div class="field">
          <label for="user">Username</label>
          <div class="box">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input id="user" type="text" value="guest8" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="pw">Password</label>
          <div class="box">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            <input id="pw" type="password" value="password" autocomplete="off">
            <button type="button" class="peek" id="peek" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn" id="signin-go">Sign In</button>
        <button type="button" class="btn ghost" id="signin-ms">Sign in with Microsoft</button>
      </form>
    </section>

    <section class="view" id="view-home">
      <div class="home-top">
        <button type="button" class="round" id="lang-btn" aria-label="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"></path></svg>
        </button>
        <button type="button" class="round" id="logout-btn" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>

      <div class="greet">
        <span class="avatar">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </span>
        <div>
          <h1>Hello, guest8</h1>
          <p>Welcome to Fish Farm Mobile</p>
        </div>
      </div>

      <div class="section-label">QUICK ACCESS</div>
      <div class="module-card" id="modules"></div>
    </section>

    <section class="view" id="view-map"></section>
    <section class="view" id="view-search"></section>
    <section class="view" id="view-cage"></section>
    <section class="view" id="view-form"></section>

  </div>

  <div class="scrim" id="scrim">
    <div class="dialog">
      <h3>Log out?</h3>
      <p>You will need your username and password to get back in.</p>
      <div class="pair">
        <button type="button" class="btn ghost" id="logout-no">Cancel</button>
        <button type="button" class="btn" id="logout-yes" style="background:var(--danger);box-shadow:none;">Log out</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script>
    'use strict';

    /* The reef behind every screen. ff-ocean.js is the canvas port of the
       app's own FishBackground, so the phone and the portal draw the same
       world; the phone runs it animated and lets the fish dodge your finger. */
    FFOcean.mount(document.getElementById('reef'), {
      intensity: 1,
      animated: true,
      interactive: true,
      bubblesOnTap: true,
      ink: '#5E72E4'
    });

    var PALETTE = {
      productions: ['#DCE4F5', '#3D4FC0'],
      feed: ['#D5EDD5', '#2E7D32'],
      deadFish: ['#FDECEA', '#C62828'],
      treatment: ['#EDE7F6', '#6A1B9A'],
      harvest: ['#FFF8E1', '#F57F17'],
      environment: ['#E0F2F1', '#00695C']
    };

    // FfTile's gradient: the palette lightened at the top, darkened at the foot.
    function mix(hex, target, amount) {
      var a = [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); });
      var b = target === 'white' ? [255, 255, 255] : [0, 0, 0];
      return 'rgb(' + a.map(function (v, i) {
        return Math.round(v + (b[i] - v) * amount);
      }).join(',') + ')';
    }

    function tile(name, size, glyph) {
      var p = PALETTE[name];
      return '<span class="tile ' + size + '" style="background:linear-gradient(180deg,' +
        mix(p[0], 'white', 0.25) + ' 0%,' + p[0] + ' 55%,' + mix(p[0], 'black', 0.05) + ' 100%);' +
        'color:' + p[1] + ';">' + glyph + '</span>';
    }

    function svg(path, w) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
        (w || 1.8) + '" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
    }

    var ICON = {
      scan: '<path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M4 12h16"></path>',
      search: '<circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>',
      map: '<path d="m9 20-6-3V4l6 3 6-3 6 3v13l-6 3-6-3z"></path><path d="M9 7v13"></path><path d="M15 4v13"></path>',

      hash: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"></path>',

    /* ---- screens ---- */

    var stack = ['signin'];

    function show(name) {
      Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) {
        v.classList.toggle('is-on', v.id === 'view-' + name);
      });
      document.getElementById('body').scrollTop = 0;
    }

    function push(name) { stack.push(name); show(name); }
    function pop() { stack.pop(); show(stack[stack.length - 1]); }

    function hero(title, subtitle, trailing) {
      return '<div class="hero">' +
        '<button type="button" class="hero-back" data-back aria-label="Back">' + svg(ICON.back, 2.2) + '</button>' +
        '<div class="hero-text"><b>' + title + '</b>' +
        (subtitle ? '<span>' + subtitle + '</span>' : '') + '</div>' +
        (trailing ? '<button type="button" class="hero-trail" data-unbuilt="' + trailing + '">' + trailing + '</button>' : '') +
        '</div>';
    }

    function toast(text) {
      var el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(el.timer);
      el.timer = setTimeout(function () { el.classList.remove('show'); }, 3200);
    }

    /* ---- home ---- */

    var MODULES = [
      { label: 'Scan', icon: 'scan', palette: 'productions', go: 'scan' },
      { label: 'Search', icon: 'search', palette: 'feed', go: 'search' },
      { label: 'Map', icon: 'map', palette: 'harvest', go: 'map' },
      { label: 'Incident Report', icon: 'incident', palette: 'deadFish', go: 'incident' }
    ];

    document.getElementById('modules').innerHTML = MODULES.map(function (m) {
      return '<button type="button" class="module" data-module="' + m.go + '">' +
        tile(m.palette, 'lg', svg(ICON[m.icon], 1.6)) +
        '<span class="label">' + m.label + '</span></button>';
    }).join('');

    /* ---- map ---- */

    var farm = 1;

    function renderMap() {
      var cages = DATA.cages.filter(function (c) { return c.farm === farm; });
      document.getElementById('view-map').innerHTML =
        hero('Map', 'Farm ' + farm) +
        '<div class="farmpick">' +
          '<button type="button" data-farm="1"' + (farm === 1 ? ' class="on"' : '') + '>Farm 1</button>' +
          '<button type="button" data-farm="2"' + (farm === 2 ? ' class="on"' : '') + '>Farm 2</button>' +
        '</div>' +
        '<div class="mapwrap"><div class="mapgrid">' +
        cages.map(function (c) {
          var occupied = c.stock > 0;
          return '<button type="button" class="cage' + (occupied ? '' : ' empty') + '"' +
            (occupied ? ' data-cage="' + c.name + '"' : ' disabled') +
            ' style="left:' + c.x + '%;top:' + c.y + '%;width:' + c.w + '%;height:' + c.h + '%;' +
            'background:' + (occupied ? '#ffffff' : '#F1F4F9') + ';' +
            'border:' + (occupied ? '1.4px solid var(--primary)' : '0.6px solid var(--line)') + ';">' +
            '<b>' + c.name + '</b>' +
            (occupied ? '<small>' + c.species + '</small>' : '<small>Empty</small>') +

    /* ---- search ---- */

    function renderSearch(query) {
      var q = (query || '').trim().toLowerCase();
      var rows = DATA.cages.filter(function (c) {
        if (!c.stock) return false;
        if (!q) return true;
        return (c.name + ' ' + c.species).toLowerCase().indexOf(q) !== -1;
      });

      document.getElementById('view-search').innerHTML =
        hero('Search', 'Ongoing productions') +
        '<div class="searchbar"><input id="q" type="search" placeholder="Cage, serial or species" value="' +

        '<div class="pad">' +

          return '<button type="button" class="result" data-cage="' + c.name + '">' +

    function renderForm(kind) {
      var f = FORMS[kind](current);
      var c = current;
      document.getElementById('view-form').innerHTML =
        hero(f.title, 'Farm ' + c.farm + ' - ' + c.name) +
        '<div class="form-body">' + f.body + '</div>' +

    /* ---- wiring ---- */

    document.getElementById('body').addEventListener('click', function (event) {
      if (event.target.closest('[data-back]')) { pop(); return; }

      var mod = event.target.closest('[data-module]');
      if (mod) {
        var go = mod.dataset.module;
        if (go === 'map') { renderMap(); push('map'); }
        else if (go === 'search') { renderSearch(''); push('search'); }
        else if (go === 'scan') {
          toast('The scanner reads the cage tag and opens that cage. The camera is not wired up here, so pick one from Map or Search.');
        } else {
          toast('Incident Report is wired to the live system, not to this walkthrough.');
        }
        return;
      }

      var fm = event.target.closest('[data-farm]');
      if (fm) { farm = Number(fm.dataset.farm); renderMap(); return; }

      var cage = event.target.closest('[data-cage]');
      if (cage) { renderCage(cage.dataset.cage); push('cage'); return; }

      var form = event.target.closest('[data-form]');
      if (form) { renderForm(form.dataset.form); push('form'); return; }

      var submit = event.target.closest('[data-submit]');
      if (submit) {
        var done = document.getElementById('view-form').dataset.done;
        submit.disabled = true;
        submit.innerHTML = '<span class="spinner"></span>';
        setTimeout(function () {
          pop();
          toast(done + '. The portal has it, and the cage totals move with it.');
        }, 800);
        return;
      }

      var choice = event.target.closest('.choice');
      if (choice) {
        Array.prototype.forEach.call(choice.parentNode.children, function (b) {
          b.classList.remove('on');
        });
        choice.classList.add('on');
        return;
      }

      var unbuilt = event.target.closest('[data-unbuilt]');
      if (unbuilt) {
        toast(unbuilt.dataset.unbuilt + ' is wired to the live system, not to this walkthrough.');
      }
    });

    document.getElementById('body').addEventListener('input', function (event) {
      if (event.target.id === 'q') {
        var at = event.target.selectionStart;
        renderSearch(event.target.value);
        var again = document.getElementById('q');
        again.focus();
        again.setSelectionRange(at, at);
      }
    });

    document.getElementById('peek').addEventListener('click', function () {
      var pw = document.getElementById('pw');
      var shown = pw.type === 'text';
      pw.type = shown ? 'password' : 'text';
      this.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
    });

    document.getElementById('signin-ms').addEventListener('click', function () {
      toast('Microsoft sign in goes through the IAM service, which hands back a token the portal swaps for its own.');
    });

    document.getElementById('signin-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var go = document.getElementById('signin-go');
      if (go.disabled) return;
      go.disabled = true;
      go.innerHTML = '<span class="spinner"></span>';
      setTimeout(function () {
        go.disabled = false;
        go.textContent = 'Sign In';
        stack = ['home'];
        show('home');
      }, 900);
    });

    document.getElementById('lang-btn').addEventListener('click', function () {
      toast('The app ships in English, Chinese, Malay and Tamil, picked here and remembered.');
    });

    var scrim = document.getElementById('scrim');
    document.getElementById('logout-btn').addEventListener('click', function () { scrim.classList.add('show'); });
    document.getElementById('logout-no').addEventListener('click', function () { scrim.classList.remove('show'); });
    document.getElementById('logout-yes').addEventListener('click', function () {
      scrim.classList.remove('show');
      stack = ['signin'];
      show('signin');
    });

    /* ---- splash: the Prime mark dissolving into a fish ---- */

    (function () {
      var wrap = document.getElementById('splash');
      var canvas = document.getElementById('splash-canvas');
      var ctx = canvas.getContext('2d');
      var W = 440, H = 440;

      // Two shapes sampled as point clouds, then one is flown into the other.
      // A rounded P for the Prime mark, a fish for where it lands.
      function pointsFromDraw(draw) {
        var off = document.createElement('canvas');
        off.width = W; off.height = H;
        var c = off.getContext('2d');
        c.fillStyle = '#fff';
        draw(c);
        var d = c.getImageData(0, 0, W, H).data;
        var pts = [];
        for (var y = 0; y < H; y += 7) {
          for (var x = 0; x < W; x += 7) {
            if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
          }
        }
        return pts;
      }

      var primePts = pointsFromDraw(function (c) {
        c.font = '800 300px Roboto, sans-serif';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText('P', W / 2, H / 2);
      });

      var fishPts = pointsFromDraw(function (c) {
        c.translate(W / 2, H / 2);
        c.scale(9, 9);
        c.beginPath();
        c.moveTo(4, -5);
        c.bezierCurveTo(11, -4, 15, -1, 16, 1);
        c.bezierCurveTo(15, 4, 11, 7, 4, 7);
        c.bezierCurveTo(-5, 8, -12, 3, -16, 1);
        c.bezierCurveTo(-12, -2, -5, -6, 4, -5);
        c.closePath();
        c.fill();
        // tail
        c.beginPath();
        c.moveTo(-16, 1);
        c.lineTo(-22, -5);
        c.lineTo(-21, 1);
        c.lineTo(-22, 7);
        c.closePath();
        c.fill();
      });

      // Pair them up so every dot has somewhere to go.
      var n = Math.min(primePts.length, fishPts.length);
      var from = primePts.slice(0, n);
      var to = fishPts.slice(0, n);
      // Sort both by angle from the centre so the cloud unfolds rather than scrambles.
      function byAngle(p) { return Math.atan2(p[1] - H / 2, p[0] - W / 2); }
      from.sort(function (a, b) { return byAngle(a) - byAngle(b); });
      to.sort(function (a, b) { return byAngle(a) - byAngle(b); });

      var HOLD = 700, MORPH = 1300, SETTLE = 900;
      var started = null;

      function easeInOut(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function frame(now) {
        if (started === null) started = now;
        var ms = now - started;
        var t = Math.min(1, Math.max(0, (ms - HOLD) / MORPH));
        var e = easeInOut(t);

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        for (var i = 0; i < n; i++) {
          var a = from[i], b = to[i];
          // A small arc on the way over, so the dots swim rather than slide.
          var lift = Math.sin(e * Math.PI) * 26 * Math.sin(i * 1.7);
          var x = a[0] + (b[0] - a[0]) * e;
          var y = a[1] + (b[1] - a[1]) * e + lift;
          ctx.beginPath();
          ctx.arc(x, y, 3.1, 0, Math.PI * 2);
          ctx.fill();
        }

        if (t > 0.75) wrap.classList.add('named');

        if (ms < HOLD + MORPH + SETTLE) {
          requestAnimationFrame(frame);
        } else {
          wrap.classList.add('gone');
          setTimeout(function () { wrap.remove(); }, 650);
        }
      }

      requestAnimationFrame(frame);

      // Frames stop while the tab is hidden, so the animation alone cannot be
      // trusted to finish. Wall clock retires the splash either way.
      setTimeout(function () {
        if (!document.body.contains(wrap)) return;
        wrap.classList.add('gone');
        setTimeout(function () { wrap.remove(); }, 650);
      }, HOLD + MORPH + SETTLE + 1500);
    }());
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Fish, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="mortality" data-title="Dead Fish" data-crumb="Dead Fish">

  <div id="content">
    <div class="card mb-4">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Daily report</h6><p class="text-sm text-secondary mb-0">By farm and species, the sheet that used to be filled in by hand</p></div>
        <button type="button" class="btn btn-sm btn-outline-primary mb-0" id="export">Export</button>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Farm</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Species</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Today</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Yesterday</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">7 days</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Trend</th></tr></thead>
          <tbody id="report"></tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Records</h6><p class="text-sm text-secondary mb-0">Every log, newest first</p></div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="d-flex flex-column">
            <label for="cage" class="text-xxs text-uppercase text-secondary font-weight-bolder mb-1">Cage</label>
            <select id="cage" class="form-control form-control-sm"><option>All cages</option></select>
          </div>
          <div class="d-flex flex-column">
            <label for="sign" class="text-xxs text-uppercase text-secondary font-weight-bolder mb-1">Clinical sign</label>
            <select id="sign" class="form-control form-control-sm"><option>All signs</option></select>
          </div>
          <button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-unbuilt="Recording dead fish">Add record</button>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Logged</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Species</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Count</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Clinical sign</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Remarks</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">By</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    /* Daily report, grouped the way the paper sheet was. */
    var group = {};
    DATA.mortality.forEach(function (m) {
      var c = DATA.cage(m.cage);
      var key = c.farm + '|' + m.species;
      if (!group[key]) group[key] = { farm: c.farm, species: m.species, today: 0, yest: 0, week: 0 };
      group[key].week += m.count;
      if (m.date.indexOf('Today') === 0) group[key].today += m.count;
      if (m.date.indexOf('Yesterday') === 0) group[key].yest += m.count;
    });

    document.getElementById('report').innerHTML = Object.keys(group).map(function (k) {
      return group[k];
    }).sort(function (a, b) { return b.week - a.week; }).map(function (g) {
      var up = g.today > g.yest;
      var same = g.today === g.yest;
      return '<tr>' +
        '<td>Farm ' + g.farm + '</td>' +
        '<td>' + g.species + ' <span class="text-xs text-secondary">' + DATA.fish(g.species).cn + '</span></td>' +
        '<td class="text-center text-sm">' + g.today + '</td>' +
        '<td class="text-center text-sm">' + g.yest + '</td>' +
        '<td class="text-center text-sm">' + g.week + '</td>' +
        '<td>' + (same ? '<span class="badge badge-sm bg-gradient-secondary">level</span>'
          : up ? '<span class="badge badge-sm bg-gradient-danger">up ' + (g.today - g.yest) + '</span>'
          : '<span class="badge badge-sm bg-gradient-success">down ' + (g.yest - g.today) + '</span>') + '</td>' +
        '</tr>';
    }).join('');

    /* Filters */
    var cage = document.getElementById('cage');
    var sign = document.getElementById('sign');

    DATA.mortality.map(function (m) { return m.cage; }).filter(function (v, i, a) { return a.indexOf(v) === i; })
      .sort().forEach(function (v) {
        var o = document.createElement('option');
        o.textContent = v;
        cage.appendChild(o);
      });

    DATA.mortality.map(function (m) { return m.sign; }).filter(function (v, i, a) { return a.indexOf(v) === i; })
      .forEach(function (v) {
        var o = document.createElement('option');
        o.textContent = v;
        sign.appendChild(o);
      });

    function paint() {
      var rows = DATA.mortality.filter(function (m) {
        if (cage.value !== 'All cages' && m.cage !== cage.value) return false;
        if (sign.value !== 'All signs' && m.sign !== sign.value) return false;
        return true;
      });

      document.getElementById('rows').innerHTML = rows.length ? rows.map(function (m) {
        return '<tr>' +
          '<td class="text-xs text-secondary">' + m.date + '</td>' +
          '<td><strong>' + m.cage + '</strong></td>' +
          '<td>' + m.species + '</td>' +
          '<td class="text-center text-sm">' + m.count + '</td>' +
          '<td>' + (m.sign === 'None noted' ? '<span class="text-xs text-secondary">' + m.sign + '</span>' : '<span class="badge badge-sm bg-gradient-danger">' + m.sign + '</span>') + '</td>' +
          '<td class="text-xs text-secondary">' + (m.note || '-') + '</td>' +
          '<td class="text-xs text-secondary">' + m.by + '</td>' +
          '</tr>';
      }).join('') : '<tr><td colspan="7" class="text-xs text-secondary" style="padding:26px;text-align:center;">Nothing matches that.</td></tr>';
    }

    cage.addEventListener('change', paint);
    sign.addEventListener('change', paint);
    paint();

    document.getElementById('export').addEventListener('click', function () {
      window.flash('The portal writes this sheet out as a spreadsheet for the monthly report.');
    });
  </script>
</body>
</html>

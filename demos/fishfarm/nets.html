<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Net Management, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="nets" data-title="Net Management" data-crumb="Net Management">

  <div id="content">
    <div class="grid g3" id="stats"></div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Net log</h6><p class="text-sm text-secondary mb-0">Broken, changed and washed, all three in one place because they follow each other</p></div>
        <div style="display:flex;gap:6px;" id="tabs">
          <button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-kind="All">All</button>
          <button type="button" class="btn btn-sm btn-outline-primary mb-0" data-kind="Broken">Broken</button>
          <button type="button" class="btn btn-sm btn-outline-primary mb-0" data-kind="Change">Change</button>
          <button type="button" class="btn btn-sm btn-outline-primary mb-0" data-kind="Wash">Wash</button>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Kind</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Logged</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Net size</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">What happened</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">State</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">By</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2"><div><h6 class="mb-1">Wash due</h6><p class="text-sm text-secondary mb-0">Nets foul in about three weeks in this water, so the log doubles as the schedule</p></div></div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Last washed</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Days ago</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Due</th></tr></thead>
          <tbody id="due"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    var KIND = { 'Broken': 'danger', 'Change': 'warning', 'Wash': 'info' };
    var STATE = { 'Open': 'danger', 'Done': 'success', 'Closed': 'secondary' };

    var counts = { Broken: 0, Change: 0, Wash: 0 };
    DATA.nets.forEach(function (n) { counts[n.kind] += 1; });

    document.getElementById('stats').innerHTML = [
      ['Open tears', DATA.nets.filter(function (n) { return n.kind === 'Broken' && n.state === 'Open'; }).length, 'Cage isolated until it is patched'],
      ['Changes this month', counts.Change, 'Grading and fouling'],
      ['Washes this month', counts.Wash, 'On the three week cycle']
    ].map(function (s) {
      return '<div class="card mb-4"><div class="stat"><div>' +
        '<div class="label">' + s[0] + '</div><div class="value">' + s[1] + '</div><div class="sub">' + s[2] + '</div>' +
        '</div></div></div>';
    }).join('');

    var want = 'All';

    function paint() {
      var rows = DATA.nets.filter(function (n) { return want === 'All' || n.kind === want; });
      document.getElementById('rows').innerHTML = rows.map(function (n) {
        return '<tr>' +
          '<td><span class="badge badge-sm bg-gradient-' + KIND[n.kind] + '">' + n.kind + '</span></td>' +
          '<td class="text-xs text-secondary">' + n.date + '</td>' +
          '<td><strong>' + n.cage + '</strong></td>' +
          '<td class="text-xs text-secondary">' + n.size + '</td>' +
          '<td>' + (n.note || '<span class="text-xs text-secondary">Routine</span>') + '</td>' +
          '<td><span class="badge badge-sm bg-gradient-' + STATE[n.state] + '">' + n.state + '</span></td>' +
          '<td class="text-xs text-secondary">' + n.by + '</td>' +
          '</tr>';
      }).join('');
    }

    document.getElementById('tabs').addEventListener('click', function (event) {
      var btn = event.target.closest('[data-kind]');
      if (!btn) return;
      want = btn.dataset.kind;
      Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      paint();
    });

    paint();

    // Turn the wash records into a schedule: whatever was washed longest ago is
    // what the crew should be looking at next.
    var AGO = { 'Today': 0, 'Yesterday': 1 };

    function daysAgo(date) {
      var head = date.split(' ')[0];
      if (AGO[head] !== undefined) return AGO[head];
      return Number(head);
    }

    var washed = {};
    DATA.nets.filter(function (n) { return n.kind === 'Wash' || n.kind === 'Change'; })
      .forEach(function (n) {
        var d = daysAgo(n.date);
        if (washed[n.cage] === undefined || d < washed[n.cage]) washed[n.cage] = d;
      });

    document.getElementById('due').innerHTML = DATA.cages.filter(function (c) { return c.stock > 0; })
      .map(function (c) {
        var d = washed[c.name] === undefined ? 24 + (c.name.charCodeAt(1) % 6) : washed[c.name];
        return { name: c.name, days: d };
      })
      .sort(function (a, b) { return b.days - a.days; })
      .map(function (r) {
        return '<tr>' +
          '<td><strong>' + r.name + '</strong></td>' +
          '<td class="text-xs text-secondary">' + (r.days === 0 ? 'Today' : r.days === 1 ? 'Yesterday' : r.days + ' days ago') + '</td>' +
          '<td class="text-center text-sm">' + r.days + '</td>' +
          '<td>' + (r.days >= 21 ? '<span class="badge badge-sm bg-gradient-danger">Overdue</span>'
            : r.days >= 14 ? '<span class="badge badge-sm bg-gradient-warning">This week</span>'
            : '<span class="badge badge-sm bg-gradient-success">Clean</span>') + '</td>' +
          '</tr>';
      }).join('');

    document.getElementById('due').addEventListener('click', function () {});
  </script>
</body>
</html>

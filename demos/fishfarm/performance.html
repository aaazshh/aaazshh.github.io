<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Performance, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="performance" data-title="Production Performance" data-crumb="Production Performance">

  <div id="content">
    <div class="grid g4" id="stats"></div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Cage by cage</h6><p class="text-sm text-secondary mb-0">Feed in against fish out, which is the number the farm is actually judged on</p></div>
        <div class="d-flex flex-column">
          <label for="sort" class="text-xxs text-uppercase text-secondary font-weight-bolder mb-1">Sort by</label>
          <select id="sort" class="form-control form-control-sm">
            <option value="fcr">Feed conversion</option>
            <option value="survival">Survival</option>
            <option value="margin">Margin</option>
          </select>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Species</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Biomass</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Feed used</th>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">FCR</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Survival</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Feed cost</th>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Value</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Margin</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="grid g2" style="margin-top:16px;">
      <div class="card mb-4">
        <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2"><div><h6 class="mb-1">Feed conversion by species</h6><p class="text-sm text-secondary mb-0">Kilos of feed per kilo of fish, lower is better</p></div></div>
        <div class="card-body"><div id="by-species"></div></div>
      </div>
      <div class="card mb-4">
        <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2"><div><h6 class="mb-1">Where the money is</h6><p class="text-sm text-secondary mb-0">Margin per cage at today's prices</p></div></div>
        <div class="card-body"><div class="bars" id="margin-bars"></div></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    var STOCKED_AT = {
      A1: 9000, A2: 8600, A3: 6400, B1: 12000, B2: 11200, B3: 5500,
      C1: 5000, C2: 7000, G1: 9800, H1: 7800, I1: 13500, J1: 9400
    };
    var FEED_PRICE = 1.85;   // dollars a kilo, averaged across the pellet sizes

    // Feed used is modelled from the biomass and a per cage conversion, which is
    // what the real report works back from the feeding records.
    var FCR = {
      A1: 1.62, A2: 1.71, A3: 1.88, B1: 1.44, B2: 1.49, B3: 2.05,
      C1: 2.31, C2: 1.95, G1: 1.58, H1: 1.83, I1: 1.41, J1: 1.76
    };

    var live = DATA.cages.filter(function (c) { return c.stock > 0; });

    var rows = live.map(function (c) {
      var f = DATA.fish(c.species);
      var biomass = c.stock * c.avg;
      var feed = biomass * FCR[c.name];
      var cost = feed * FEED_PRICE;
      var value = biomass * f.price;
      return {
        cage: c, fish: f, biomass: biomass, feed: feed, fcr: FCR[c.name],
        survival: c.stock / STOCKED_AT[c.name] * 100,
        cost: cost, value: value, margin: value - cost
      };
    });

    var totalBiomass = rows.reduce(function (n, r) { return n + r.biomass; }, 0);
    var totalFeed = rows.reduce(function (n, r) { return n + r.feed; }, 0);
    var totalMargin = rows.reduce(function (n, r) { return n + r.margin; }, 0);
    var avgSurvival = rows.reduce(function (n, r) { return n + r.survival; }, 0) / rows.length;

    document.getElementById('stats').innerHTML = [
      ['Feed conversion', (totalFeed / totalBiomass).toFixed(2), 'Kilos of feed per kilo of fish'],
      ['Feed used', Math.round(totalFeed).toLocaleString() + ' kg', 'Across the current batches'],
      ['Survival', avgSurvival.toFixed(1) + '%', 'Against what was stocked'],
      ['Margin on the water', '$' + Math.round(totalMargin).toLocaleString(), 'Value less feed cost']
    ].map(function (s) {
      return '<div class="card mb-4"><div class="stat"><div>' +
        '<div class="label">' + s[0] + '</div><div class="value">' + s[1] + '</div><div class="sub">' + s[2] + '</div>' +
        '</div></div></div>';
    }).join('');

    function paint() {
      var key = document.getElementById('sort').value;
      var sorted = rows.slice().sort(function (a, b) {
        return key === 'fcr' ? a.fcr - b.fcr : b[key] - a[key];
      });

      document.getElementById('rows').innerHTML = sorted.map(function (r) {
        return '<tr>' +
          '<td><strong>' + r.cage.name + '</strong> <span class="text-xs text-secondary">Farm ' + r.cage.farm + '</span></td>' +
          '<td>' + r.cage.species + ' <span class="text-xs text-secondary">' + r.fish.cn + '</span></td>' +
          '<td class="text-center text-sm">' + Math.round(r.biomass).toLocaleString() + ' kg</td>' +
          '<td class="text-center text-sm">' + Math.round(r.feed).toLocaleString() + ' kg</td>' +
          '<td class="text-center text-sm">' + (r.fcr <= 1.6 ? '<span class="badge badge-sm bg-gradient-success">' + r.fcr.toFixed(2) + '</span>'
            : r.fcr >= 2 ? '<span class="badge badge-sm bg-gradient-danger">' + r.fcr.toFixed(2) + '</span>'
            : r.fcr.toFixed(2)) + '</td>' +
          '<td class="text-center text-sm">' + r.survival.toFixed(1) + '%</td>' +
          '<td class="text-center text-xs text-secondary">$' + Math.round(r.cost).toLocaleString() + '</td>' +
          '<td class="text-center text-sm">$' + Math.round(r.value).toLocaleString() + '</td>' +
          '<td class="text-center text-sm" style="font-weight:600;">$' + Math.round(r.margin).toLocaleString() + '</td>' +
          '</tr>';
      }).join('');
    }

    document.getElementById('sort').addEventListener('change', paint);
    paint();

    var bySpecies = {};
    rows.forEach(function (r) {
      var s = bySpecies[r.cage.species] || (bySpecies[r.cage.species] = { feed: 0, biomass: 0 });
      s.feed += r.feed;
      s.biomass += r.biomass;
    });

    var list = Object.keys(bySpecies).map(function (k) {
      return { name: k, fcr: bySpecies[k].feed / bySpecies[k].biomass };
    }).sort(function (a, b) { return a.fcr - b.fcr; });

    document.getElementById('by-species').innerHTML = list.map(function (s) {
      return '<div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin-bottom:13px;">' +
        '<div style="font-size:13.5px;">' + s.name + ' <span class="text-xs text-secondary">' + DATA.fish(s.name).cn + '</span></div>' +
        '<div class="text-center text-sm" style="font-size:13.5px;font-weight:600;">' + s.fcr.toFixed(2) + '</div>' +
        '<div style="grid-column:1/3;height:7px;border-radius:4px;background:var(--ff-pale);overflow:hidden;">' +
          '<span style="display:block;height:100%;width:' + (s.fcr / 2.4 * 100) + '%;background:' +
          (s.fcr >= 2 ? '#d9534f' : 'linear-gradient(90deg,var(--ff-bright),var(--ff-teal))') + ';"></span>' +
        '</div></div>';
    }).join('');

    var best = rows.slice().sort(function (a, b) { return b.margin - a.margin; }).slice(0, 7);
    var most = best[0].margin;
    document.getElementById('margin-bars').innerHTML = best.map(function (r) {
      return '<div><b style="font-size:11px;">$' + Math.round(r.margin / 1000) + 'k</b>' +
        '<i style="height:' + Math.round(r.margin / most * 110) + 'px"></i>' +
        '<span>' + r.cage.name + '</span></div>';
    }).join('');
  </script>
</body>
</html>

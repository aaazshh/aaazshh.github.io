<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Productions, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
</head>
<body data-page="production" data-title="Fish Productions" data-sub="Operations">

  <div id="content">
    <div class="grid g4" id="stats"></div>

    <div class="card" style="margin-top:16px;">
      <div class="card-head">
        <div><h2>Batches in the water</h2><p>One row per stocked cage, from the day it went in</p></div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="field">
            <label for="sp">Species</label>
            <select id="sp"><option>All species</option></select>
          </div>
          <button type="button" class="btn" data-skip="Adding a production">Add production</button>
        </div>
      </div>
      <div class="wrap">
        <table>
          <thead><tr>
            <th>Cage</th><th>Species</th><th>Stocked</th><th class="num">Days in</th>
            <th class="num">Stock</th><th class="num">Avg weight</th><th class="num">Biomass</th>
            <th class="num">Survival</th><th>Status</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    'use strict';

    // Days in the water, worked back from the stocking date on the record.
    var MONTH = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

    function daysIn(stocked) {
      if (!stocked) return 0;
      var bits = stocked.split(' ');
      var then = new Date(2026, MONTH[bits[1]], Number(bits[0]));
      return Math.round((new Date(2026, 8, 20) - then) / 86400000);
    }

    // What went in against what is still swimming.
    var STOCKED_AT = {
      A1: 9000, A2: 8600, A3: 6400, B1: 12000, B2: 11200, B3: 5500,
      C1: 5000, C2: 7000, G1: 9800, H1: 7800, I1: 13500, J1: 9400
    };

    var live = DATA.cages.filter(function (c) { return c.stock > 0; });

    var biomass = live.reduce(function (n, c) { return n + c.stock * c.avg; }, 0);
    var value = live.reduce(function (n, c) { return n + c.stock * c.avg * DATA.fish(c.species).price; }, 0);
    var survival = live.reduce(function (n, c) { return n + c.stock / STOCKED_AT[c.name]; }, 0) / live.length * 100;

    document.getElementById('stats').innerHTML = [
      ['Batches', live.length, 'In the water now'],
      ['Biomass', Math.round(biomass).toLocaleString() + ' kg', 'Across both farms'],
      ['Value at market', '$' + Math.round(value).toLocaleString(), 'At today\'s species prices'],
      ['Average survival', survival.toFixed(1) + '%', 'Against what was stocked']
    ].map(function (s) {
      return '<div class="card"><div class="stat"><div>' +
        '<div class="label">' + s[0] + '</div><div class="value">' + s[1] + '</div><div class="sub">' + s[2] + '</div>' +
        '</div></div></div>';
    }).join('');

    var select = document.getElementById('sp');
    live.map(function (c) { return c.species; }).filter(function (s, i, a) { return a.indexOf(s) === i; })
      .forEach(function (s) {
        var opt = document.createElement('option');
        opt.textContent = s;
        select.appendChild(opt);
      });

    var PILL = { 'Growing': '', 'Near harvest': 'good', 'Net repair': 'warn', 'Treatment': 'bad' };

    function paint() {
      var want = select.value;
      document.getElementById('rows').innerHTML = live.filter(function (c) {
        return want === 'All species' || c.species === want;
      }).map(function (c) {
        var f = DATA.fish(c.species);
        var rate = c.stock / STOCKED_AT[c.name] * 100;
        return '<tr>' +
          '<td><strong>' + c.name + '</strong> <span class="dim">Farm ' + c.farm + '</span></td>' +
          '<td>' + c.species + ' <span class="dim">' + f.cn + '</span></td>' +
          '<td class="dim">' + c.stocked + '</td>' +
          '<td class="num">' + daysIn(c.stocked) + '</td>' +
          '<td class="num">' + c.stock.toLocaleString() + '</td>' +
          '<td class="num">' + c.avg.toFixed(2) + ' kg</td>' +
          '<td class="num">' + Math.round(c.stock * c.avg).toLocaleString() + ' kg</td>' +
          '<td class="num">' + rate.toFixed(1) + '%</td>' +
          '<td><span class="pill ' + PILL[c.status] + '">' + c.status + '</span></td>' +
          '</tr>';
      }).join('');
    }

    select.addEventListener('change', paint);
    paint();
  </script>
</body>
</html>

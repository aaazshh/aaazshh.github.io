<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Productions, Fish Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link id="pagestyle" href="assets/css/argon-dashboard.min.css" rel="stylesheet">
  <link href="assets/css/brand.css" rel="stylesheet">
  <link href="assets/css/ff-ocean.css" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100" data-page="production" data-title="Fish Productions" data-crumb="Fish Productions">

  <div id="content">
    <div class="grid g4" id="stats"></div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header pb-0 d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div><h6 class="mb-1">Batches in the water</h6><p class="text-sm text-secondary mb-0">One row per stocked cage, from the day it went in</p></div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="d-flex flex-column">
            <label for="sp" class="text-xxs text-uppercase text-secondary font-weight-bolder mb-1">Species</label>
            <select id="sp" class="form-control form-control-sm"><option>All species</option></select>
          </div>
          <button type="button" class="btn btn-sm bg-gradient-primary mb-0" data-unbuilt="Adding a production">Add production</button>
        </div>
      </div>
      <div class="table-responsive p-0">
        <table class="table align-items-center mb-0">
          <thead><tr>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cage</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Species</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Stocked</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Days in</th>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Stock</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Avg weight</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Biomass</th>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 text-center">Survival</th><th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Status</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="assets/js/ff-ocean.js"></script>
  <script src="assets/js/ff-ocean-page.js"></script>
  <script>
    'use strict';

    // Days in the water, worked back from the stocking date on the record.
    var MONTH = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

    function daysIn(stocked) {
      if (!stocked) return 0;
      var bits = stocked.split(' ');
      var then = new Date(2026, MONTH[bits[1]], Number(bits[0]));
      return Math.round((new Date(2026, 8, 20) - then) / 86400000);
    }

    // What went in against what is still swimming.
    var STOCKED_AT = {
      A1: 9000, A2: 8600, A3: 6400, B1: 12000, B2: 11200, B3: 5500,
      C1: 5000, C2: 7000, G1: 9800, H1: 7800, I1: 13500, J1: 9400
    };

    var live = DATA.cages.filter(function (c) { return c.stock > 0; });

    var biomass = live.reduce(function (n, c) { return n + c.stock * c.avg; }, 0);
    var value = live.reduce(function (n, c) { return n + c.stock * c.avg * DATA.fish(c.species).price; }, 0);
    var survival = live.reduce(function (n, c) { return n + c.stock / STOCKED_AT[c.name]; }, 0) / live.length * 100;

    document.getElementById('stats').innerHTML = [
      ['Batches', live.length, 'In the water now'],
      ['Biomass', Math.round(biomass).toLocaleString() + ' kg', 'Across both farms'],
      ['Value at market', '$' + Math.round(value).toLocaleString(), 'At today\'s species prices'],
      ['Average survival', survival.toFixed(1) + '%', 'Against what was stocked']
    ].map(function (s) {
      return '<div class="card mb-4"><div class="stat"><div>' +
        '<div class="label">' + s[0] + '</div><div class="value">' + s[1] + '</div><div class="sub">' + s[2] + '</div>' +
        '</div></div></div>';
    }).join('');

    var select = document.getElementById('sp');
    live.map(function (c) { return c.species; }).filter(function (s, i, a) { return a.indexOf(s) === i; })
      .forEach(function (s) {
        var opt = document.createElement('option');
        opt.textContent = s;
        select.appendChild(opt);
      });

    var PILL = { 'Growing': 'info', 'Near harvest': 'success', 'Net repair': 'warning', 'Treatment': 'danger' };

    function paint() {
      var want = select.value;
      document.getElementById('rows').innerHTML = live.filter(function (c) {
        return want === 'All species' || c.species === want;
      }).map(function (c) {
        var f = DATA.fish(c.species);
        var rate = c.stock / STOCKED_AT[c.name] * 100;
        return '<tr>' +
          '<td><strong>' + c.name + '</strong> <span class="text-xs text-secondary">Farm ' + c.farm + '</span></td>' +
          '<td>' + c.species + ' <span class="text-xs text-secondary">' + f.cn + '</span></td>' +
          '<td class="text-xs text-secondary">' + c.stocked + '</td>' +
          '<td class="text-center text-sm">' + daysIn(c.stocked) + '</td>' +
          '<td class="text-center text-sm">' + c.stock.toLocaleString() + '</td>' +
          '<td class="text-center text-sm">' + c.avg.toFixed(2) + ' kg</td>' +
          '<td class="text-center text-sm">' + Math.round(c.stock * c.avg).toLocaleString() + ' kg</td>' +
          '<td class="text-center text-sm">' + rate.toFixed(1) + '%</td>' +
          '<td><span class="badge badge-sm bg-gradient-' + PILL[c.status] + '">' + c.status + '</span></td>' +
          '</tr>';
      }).join('');
    }

    select.addEventListener('change', paint);
    paint();
  </script>
</body>
</html>

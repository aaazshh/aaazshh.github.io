<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Home Dashboard</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
  <link id="pagestyle" href="assets/css/argon-dashboard.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <style>
    .sidenav {
      background-color: white;
    }
  </style>
  <style>
    .access-section {
        background: #fff7ed;
        border: 1px solid #0000002d;
        border-radius: 0.375rem;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(251, 146, 60, 0.15);
    }

    .access-title {
        display: block;
        width: 100%;
        font-size: 1.4em;
        background-color: rgb(214, 119, 9);
        color: white;
        padding: 0.5rem 0.7rem;
    }

    .access-list {
        list-style: none;
        padding: 0.5rem 0.7rem;
    }

    .access-item {
        padding: 0.6em 0;
        border-bottom: 1px solid #fed7aa;
        display: flex;
        align-items: center;
    }

    .access-item:last-child {
        border-bottom: none;
    }

    .label {
        font-weight: 600;
        color: #7c2d12;
    }

    .value {
        color: #ea580c;
        margin-left: 0.5em;
        font-weight: 500;
    }

    .access-section:hover {
        background: #fff0e0;
        transition: background 0.3s ease;
    }
  </style>
  <link rel="stylesheet" href="demo.css">
</head>
<body class="g-sidenav-show bg-gray-100">
  <script src="menu.js"></script>
  <script src="../iam-sso.js"></script>
  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="js/home.js"></script>
  <script src="assets/js/core/bootstrap.bundle.min.js"></script>
  <script src="assets/js/core/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <script src="assets/js/core/popper.min.js"></script>
  <script src="assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="assets/js/plugins/smooth-scrollbar.min.js"></script>
  <link href="assets/css/select2.min.css" rel="stylesheet">
  <script src="assets/js/plugins/select2.min.js"></script>
  <script src="assets/js/argon-dashboard.min.js"></script>
  <link rel="stylesheet" href="assets/css/dataTables.bootstrap5.css">
  <script src="assets/js/core/dataTables.js"></script>
  <script src="assets/js/core/dataTables.bootstrap5.js"></script>
  <script src="assets/js/core/dataTables.scrollToTop.min.js"></script>
  <script>Shell.start();</script>
</body>
</html>

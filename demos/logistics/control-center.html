<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Center, Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="app" data-page="control-center" data-title="Control Center">

    <div class="cc-layout">
      <div class="card" style="margin:0;">
        <div class="card-header">
          <div>
            <div class="card-title">On the road</div>
            <div class="card-subtitle">6 of 18 vehicles</div>
          </div>
        </div>
        <div id="cc-list"></div>
      </div>

      <div class="card" style="margin:0;">
        <div class="card-header">
          <div>
            <div class="card-title" id="cc-title"></div>
            <div class="card-subtitle" id="cc-sub"></div>
          </div>
        </div>
        <div id="cc-map" class="cc-map"></div>
        <div id="cc-stops"></div>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script>
    'use strict';

    var map = L.map('cc-map', { zoomControl: true }).setView([1.3521, 103.8198], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 19
    }).addTo(map);

    var layer = L.layerGroup().addTo(map);
    var truckMarker = null;

    function stopIcon(state, n) {
      var fill = state === 'done' ? '#2a9d8f' : state === 'next' ? '#d97706' : '#94a3b8';
      return L.divIcon({
        className: '', iconSize: [22, 22], iconAnchor: [11, 11],
        html: '<div style="width:22px;height:22px;border-radius:50%;background:' + fill +
          ';color:#fff;font:600 11px/22px Inter,sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.3)">' + n + '</div>'
      });
    }

    var truckIcon = L.divIcon({
      className: '', iconSize: [30, 30], iconAnchor: [15, 15],
      html: '<div style="width:30px;height:30px;border-radius:50%;background:#264653;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg></div>'
    });

    function state(trip, i) {
      if (i < trip.done) return 'done';
      if (i === trip.done) return 'next';
      return 'queued';
    }

    function draw(index) {
      var trip = DATA.live[index];
      layer.clearLayers();

      var line = DATA.coords(trip.stops);
      L.polyline(line, { color: '#2a9d8f', weight: 4, opacity: 0.75 }).addTo(layer);

      trip.stops.forEach(function (name, i) {
        var o = DATA.outlet(name);
        L.marker([o.lat, o.lng], { icon: stopIcon(state(trip, i), i + 1) })
          .bindPopup('<strong>' + o.name + '</strong><br>' + o.addr)
          .addTo(layer);
      });

      truckMarker = L.marker(trip.at, { icon: truckIcon, zIndexOffset: 500 })
        .bindPopup('<strong>' + trip.plate + '</strong><br>' + trip.driver)
        .addTo(layer);

      map.fitBounds(L.polyline(line).getBounds(), { padding: [40, 40] });

      document.getElementById('cc-title').textContent = trip.plate;
      document.getElementById('cc-sub').textContent =
        trip.driver + ', trip ' + trip.trip + ', ' + trip.done + ' of ' + trip.total + ' stops done';

      document.getElementById('cc-stops').innerHTML =
        '<div class="table-responsive"><table class="table"><thead><tr>' +
        '<th style="width:48px;">#</th><th>Stop</th><th>Address</th><th>Status</th>' +
        '</tr></thead><tbody>' +
        trip.stops.map(function (name, i) {
          var o = DATA.outlet(name);
          var s = state(trip, i);
          var chip = s === 'done' ? '<span class="status-chip status-completed">Delivered</span>'
            : s === 'next' ? '<span class="status-chip status-in">On the way</span>'
            : '<span class="status-chip status-idle">Queued</span>';
          return '<tr><td>' + (i + 1) + '</td><td><strong>' + o.name + '</strong></td>' +
            '<td style="color:#6b7280;">' + o.addr + '</td><td>' + chip + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';

      Array.prototype.forEach.call(document.querySelectorAll('#cc-list .cc-vehicle'), function (el, i) {
        el.classList.toggle('is-active', i === index);
      });
    }

    var list = document.getElementById('cc-list');
    list.innerHTML = DATA.live.map(function (t, i) {
      var pct = Math.round(t.done / t.total * 100);
      return '<button type="button" class="cc-vehicle' + (i === 0 ? ' is-active' : '') + '" data-i="' + i + '">' +
        '<div class="cc-plate">' + t.plate + '</div>' +
        '<div class="cc-driver">' + t.driver + ', ' + t.done + '/' + t.total + ' stops</div>' +
        '<div class="cc-progress"><span style="width:' + pct + '%"></span></div>' +
        '</button>';
    }).join('');

    list.addEventListener('click', function (event) {
      var btn = event.target.closest('.cc-vehicle');
      if (btn) draw(Number(btn.dataset.i));
    });

    draw(0);

    // The real page moves these markers from the GPS the driver app sends in.
    // Here they wander a little so the map is not a still picture.
    setInterval(function () {
      if (!truckMarker) return;
      var p = truckMarker.getLatLng();
      truckMarker.setLatLng([p.lat + (Math.random() - 0.5) * 0.002, p.lng + (Math.random() - 0.5) * 0.002]);
    }, 2000);
  </script>
</body>
</html>

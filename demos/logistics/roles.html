<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Role Management, Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="app" data-page="roles" data-title="Role Management">

    <div class="page-header">
      <div>
        <h2>Role Management</h2>
        <p>Role names are per company, the permission family is what every check reads</p>
      </div>
      <button type="button" class="btn btn-primary" id="add-role">+ Add Role</button>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Roles</div>
        <span class="badge badge-admin" id="role-count">—</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Role Name</th>
              <th>Type</th>
              <th>Company</th>
              <th>Users</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="roles-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-overlay" id="role-modal" role="dialog" aria-modal="true" aria-labelledby="role-modal-title">
      <div class="modal" style="max-width:440px;">
        <div class="modal-header">
          <div class="modal-title" id="role-modal-title">Add Role</div>
          <button class="modal-close" data-close="role-modal" aria-label="Close">&times;</button>
        </div>
        <form id="role-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label" for="role-name">Role Name <span class="required">*</span></label>
              <input type="text" id="role-name" class="form-control" placeholder="e.g. psm_supervisor" required maxlength="50">
              <p class="form-hint">Names are never permission-checked, the type below is.</p>
            </div>
            <div class="form-group">
              <label class="form-label" for="role-kind">Type <span class="required">*</span></label>
              <select id="role-kind" class="form-control" required>
                <option value="admin">Admin — manages their company</option>
                <option value="driver">Driver — uses the driver app</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="role-company">Company</label>
              <select id="role-company" class="form-control">
                <option value="">— Not company-specific —</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-close="role-modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="role-submit">Save Role</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="role-delete-modal" role="dialog" aria-modal="true" aria-labelledby="role-delete-title">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title" id="role-delete-title">Delete Role</div>
          <button class="modal-close" data-close="role-delete-modal" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p>Delete <strong id="role-delete-name"></strong>? A role still holding users cannot be deleted.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close="role-delete-modal">Cancel</button>
          <button class="btn btn-danger" id="role-delete-confirm">Delete</button>
        </div>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    'use strict';

    function $(id) { return document.getElementById(id); }

    var roles = DATA.roles;
    var editingId = null;
    var pendingDelete = null;

    $('role-company').innerHTML += DATA.companies.map(function (c) {
      return '<option value="' + c.name + '">' + c.name + '</option>';
    }).join('');

    function kindBadge(r) {
      return r.kind === 'driver'
        ? '<span class="badge badge-driver">Driver</span>'
        : '<span class="badge badge-admin">' + (r.kind === 'super_admin' ? 'Super Admin' : 'Admin') + '</span>';
    }

    function render() {
      $('role-count').textContent = roles.length + ' total';
      $('roles-tbody').innerHTML = roles.map(function (r) {
        var actions = r.builtin
          ? '<span class="text-muted text-sm">Built-in</span>'
          : '<button class="btn btn-ghost btn-sm" data-edit="' + r.id + '">Edit</button>' +
            '<button class="btn btn-ghost btn-sm" style="color:var(--danger);" data-del="' + r.id + '">Delete</button>';
        return '<tr>' +
          '<td><span style="font-family:monospace;font-weight:600;">' + r.name + '</span></td>' +
          '<td>' + kindBadge(r) + '</td>' +
          '<td class="text-sm">' + (r.company || '<span class="text-muted">All companies</span>') + '</td>' +
          '<td class="text-sm">' + r.users + '</td>' +
          '<td style="text-align:right;white-space:nowrap;">' + actions + '</td>' +
          '</tr>';
      }).join('');
    }

    $('add-role').addEventListener('click', function () {
      editingId = null;
      $('role-modal-title').textContent = 'Add Role';
      $('role-form').reset();
      $('role-modal').classList.add('open');
    });

    $('roles-tbody').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-edit], button[data-del]');
      if (!btn) return;
      var r = roles.filter(function (x) { return x.id === Number(btn.dataset.edit || btn.dataset.del); })[0];

      if (btn.dataset.del) {
        if (r.users) {
          window.flash(r.name + ' still has ' + r.users + ' user(s). Move them to another role first.');
          return;
        }
        pendingDelete = r;
        $('role-delete-name').textContent = r.name;
        $('role-delete-modal').classList.add('open');
        return;
      }

      editingId = r.id;
      $('role-modal-title').textContent = 'Edit Role';
      $('role-name').value = r.name;
      $('role-kind').value = r.kind;
      $('role-company').value = r.company || '';
      $('role-modal').classList.add('open');
    });

    $('role-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var name = $('role-name').value.trim().toLowerCase().replace(/\s+/g, '_');
      var kind = $('role-kind').value;
      var company = $('role-company').value || null;
      if (!name) { window.flash('A role name is required.'); return; }

      if (editingId) {
        var r = roles.filter(function (x) { return x.id === editingId; })[0];
        var old = r.name;
        r.name = name; r.kind = kind; r.company = company;
        DATA.users.forEach(function (u) { if (u.role === old) { u.role = name; u.kind = kind; } });
        window.flash(old + ' is now ' + name + '. Everyone on it keeps their access, because the type is what is checked.');
      } else {
        roles.push({
          id: Math.max.apply(null, roles.map(function (x) { return x.id; })) + 1,
          name: name, kind: kind, company: company, users: 0, builtin: false
        });
        window.flash(name + ' created. It shows up in the role picker on User Management for ' +
          (company || 'every company') + '.');
      }

      $('role-modal').classList.remove('open');
      render();
    });

    $('role-delete-confirm').addEventListener('click', function () {
      roles.splice(roles.indexOf(pendingDelete), 1);
      $('role-delete-modal').classList.remove('open');
      render();
      window.flash(pendingDelete.name + ' deleted.');
      pendingDelete = null;
    });

    document.addEventListener('click', function (event) {
      var closer = event.target.closest('[data-close]');
      if (closer) document.getElementById(closer.dataset.close).classList.remove('open');
      else if (event.target.classList.contains('modal-overlay')) event.target.classList.remove('open');
    });

    render();
  </script>
</body>
</html>

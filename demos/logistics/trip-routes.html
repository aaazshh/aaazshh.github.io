<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Routes, Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="app" data-page="trip-routes" data-title="Trip Routes">

    <div class="cc-layout">
      <div class="card" style="margin:0;">
        <div class="card-header">
          <div>
            <div class="card-title">Finished trips</div>
            <div class="card-subtitle">Yesterday</div>
          </div>
        </div>
        <div id="tr-list"></div>
      </div>

      <div class="card" style="margin:0;">
        <div class="card-header">
          <div>
            <div class="card-title" id="tr-title"></div>
            <div class="card-subtitle" id="tr-sub"></div>
          </div>
        </div>
        <div id="tr-map" class="cc-map"></div>
        <div class="tr-controls">
          <button type="button" class="btn btn-primary btn-sm" id="tr-play">Play</button>
          <span class="tr-clock" id="tr-clock"></span>
          <input type="range" id="tr-scrub" class="tr-scrub" min="0" max="1000" value="0" step="1" aria-label="Scrub the trip">
          <div class="tr-speeds">
            <button type="button" class="tr-speed-btn is-active" data-mult="1">1x</button>
            <button type="button" class="tr-speed-btn" data-mult="2">2x</button>
            <button type="button" class="tr-speed-btn" data-mult="4">4x</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header" style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <div class="card-title">Delivery audit log</div>
          <div class="card-subtitle">Every stop across every trip, what went out against what the outlet signed for</div>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label" for="driver">Driver</label>
          <select id="driver" class="form-control"><option>All drivers</option></select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr><th>Trip</th><th>Stop</th><th>Driver</th><th>Arrived</th><th>Sent</th><th>Signed for</th><th>Outcome</th></tr>
          </thead>
          <tbody id="audit"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script>
    'use strict';

    var map = L.map('tr-map').setView([1.3521, 103.8198], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 19
    }).addTo(map);

    var layer = L.layerGroup().addTo(map);
    var trail = null, marker = null, path = [];
    var trip = DATA.history[0];
    var playing = false, mult = 1, t = 0, last = 0;

    var dot = L.divIcon({
      className: '', iconSize: [18, 18], iconAnchor: [9, 9],
      html: '<div style="width:18px;height:18px;border-radius:50%;background:#264653;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>'
    });

    function stopIcon(n) {
      return L.divIcon({
        className: '', iconSize: [20, 20], iconAnchor: [10, 10],
        html: '<div style="width:20px;height:20px;border-radius:50%;background:#2a9d8f;color:#fff;font:600 11px/20px Inter,sans-serif;text-align:center">' + n + '</div>'
      });
    }

    function load(index) {
      trip = DATA.history[index];
      layer.clearLayers();
      path = DATA.coords(trip.stops.map(function (s) { return s[0]; }));

      L.polyline(path, { color: '#cbd5e1', weight: 4 }).addTo(layer);
      trail = L.polyline([path[0]], { color: '#2a9d8f', weight: 4 }).addTo(layer);
      trip.stops.forEach(function (s, i) {
        L.marker(path[i], { icon: stopIcon(i + 1) })
          .bindPopup('<strong>' + s[0] + '</strong><br>Arrived ' + s[1]).addTo(layer);
      });
      marker = L.marker(path[0], { icon: dot, zIndexOffset: 600 }).addTo(layer);
      map.fitBounds(L.polyline(path).getBounds(), { padding: [40, 40] });

      document.getElementById('tr-title').textContent = trip.id + ', ' + trip.plate;
      document.getElementById('tr-sub').textContent =
        trip.driver + ', ' + trip.stops.length + ' stops, ' + trip.start + ' to ' + trip.end;

      t = 0;
      document.getElementById('tr-scrub').value = 0;
      seek(0);

      Array.prototype.forEach.call(document.querySelectorAll('#tr-list .cc-vehicle'), function (el, i) {
        el.classList.toggle('is-active', i === index);
      });
    }

    // Walks the position along the leg the scrub value falls in, and reports the
    // time the way the playback on the real page does.
    function seek(value) {
      var legs = path.length - 1;
      var pos = value / 1000 * legs;
      var leg = Math.min(Math.floor(pos), legs - 1);
      var f = pos - leg;

      var a = path[leg], b = path[leg + 1];
      var here = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
      marker.setLatLng(here);
      trail.setLatLngs(path.slice(0, leg + 1).concat([here]));

      var from = toMinutes(trip.stops[leg][1]);
      var to = toMinutes(trip.stops[leg + 1][1]);
      var mins = from + (to - from) * f;
      document.getElementById('tr-clock').textContent =
        clock(mins) + ', stop ' + (leg + 1) + ' of ' + trip.stops.length;
    }

    function toMinutes(hhmm) {
      var p = hhmm.split(':');
      return Number(p[0]) * 60 + Number(p[1]);
    }

    function clock(mins) {
      return pad(Math.floor(mins / 60)) + ':' + pad(Math.floor(mins % 60)) + ':' + pad(Math.floor((mins % 1) * 60));
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function frame(now) {
      if (playing) {
        if (last) {
          t += (now - last) * 0.03 * mult;
          if (t >= 1000) { t = 1000; stop(); }
          document.getElementById('tr-scrub').value = t;
          seek(t);
        }
        last = now;
      } else {
        last = 0;
      }
      requestAnimationFrame(frame);
    }

    function stop() {
      playing = false;
      document.getElementById('tr-play').textContent = 'Play';
    }

    document.getElementById('tr-play').addEventListener('click', function () {
      if (t >= 1000) { t = 0; document.getElementById('tr-scrub').value = 0; seek(0); }
      playing = !playing;
      this.textContent = playing ? 'Pause' : 'Play';
    });

    document.getElementById('tr-scrub').addEventListener('input', function () {
      t = Number(this.value);
      seek(t);
    });

    document.querySelector('.tr-speeds').addEventListener('click', function (event) {
      var btn = event.target.closest('.tr-speed-btn');
      if (!btn) return;
      mult = Number(btn.dataset.mult);
      Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
    });

    document.getElementById('tr-list').innerHTML = DATA.history.map(function (tr, i) {
      return '<button type="button" class="cc-vehicle' + (i === 0 ? ' is-active' : '') + '" data-i="' + i + '">' +
        '<div class="cc-plate">' + tr.id + '</div>' +
        '<div class="cc-driver">' + tr.plate + ', ' + tr.driver + '</div>' +
        '<div class="cc-driver">' + tr.stops.length + ' stops, ' + tr.start + ' to ' + tr.end + '</div>' +
        '</button>';
    }).join('');

    document.getElementById('tr-list').addEventListener('click', function (event) {
      var btn = event.target.closest('.cc-vehicle');
      if (!btn) return;
      stop();
      load(Number(btn.dataset.i));
    });

    /* Audit log ------------------------------------------------------------ */

    // Two rows out of the set are short, which is the whole point of keeping
    // what was sent next to what was signed for.
    var SHORT = { 'TR-4402|Queenstown Blk 52': 2, 'TR-4405|Geylang Serai': 1 };

    var audit = [];
    DATA.history.forEach(function (tr) {
      tr.stops.forEach(function (s, i) {
        if (i === 0) return;
        var sent = 8 + ((s[0].length * 3 + i * 5) % 28);
        var short = SHORT[tr.id + '|' + s[0]] || 0;
        audit.push({
          trip: tr.id, stop: s[0], driver: tr.driver, at: s[1],
          sent: sent, signed: sent - short, short: short
        });
      });
    });

    var drivers = DATA.history.map(function (tr) { return tr.driver; }).filter(function (d, i, a) {
      return a.indexOf(d) === i;
    });
    var select = document.getElementById('driver');
    drivers.forEach(function (d) {
      var opt = document.createElement('option');
      opt.textContent = d;
      select.appendChild(opt);
    });

    function paintAudit() {
      var who = select.value;
      document.getElementById('audit').innerHTML = audit.filter(function (a) {
        return who === 'All drivers' || a.driver === who;
      }).map(function (a) {
        return '<tr>' +
          '<td><strong>' + a.trip + '</strong></td>' +
          '<td>' + a.stop + '</td>' +
          '<td>' + a.driver + '</td>' +
          '<td>' + a.at + '</td>' +
          '<td>' + a.sent + ' cases</td>' +
          '<td>' + a.signed + ' cases</td>' +
          '<td>' + (a.short
            ? '<span class="status-chip status-pending">' + a.short + ' short</span>'
            : '<span class="status-chip status-completed">Matched</span>') + '</td>' +
          '</tr>';
      }).join('');
    }

    select.addEventListener('change', paintAudit);
    paintAudit();

    load(0);
    requestAnimationFrame(frame);
  </script>
</body>
</html>

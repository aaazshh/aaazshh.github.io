  <template id="window-frame">
    <section class="window" role="dialog" aria-modal="false">
      <header class="titlebar">
        <h2 class="title"></h2>
        <button type="button" class="close" aria-label="Close window">

      <div class="pane" tabindex="-1"></div>

  <!-- Window contents. Screenshots of the portals and the apps come in a later
       pass, so the panes that need them say so instead of faking it. -->
  <div class="contents" hidden>
    <template data-window="experience" data-title="experience/">
      <p class="lede">Prime Supermarket, software development internship, six months.
        Five systems. Three of them have a web half and a mobile half that were built
        to work as one thing, so they are filed as one thing.</p>
      <ul class="systems">
        <li>
          <button type="button" class="row" data-open="logistics" aria-haspopup="dialog">
            <span class="row-name">Logistics</span>
            <span class="row-note">Multi company fleet management, route optimisation, driver app</span>
            <span class="platforms"><span class="chip">web</span><span class="chip">mobile</span></span>
          </button>
        </li>
        <li>
          <button type="button" class="row" data-open="fishfarm" aria-haspopup="dialog">
            <span class="row-name">Fish Farm</span>
            <span class="row-note">Operations portal that replaced the paper logs</span>
            <span class="platforms"><span class="chip">web</span><span class="chip">mobile</span></span>
          </button>
        </li>
        <li>
          <button type="button" class="row" data-open="hq" aria-haspopup="dialog">
            <span class="row-name">HQ</span>
            <span class="row-note">Laravel backend and a Flutter app over the same workflows</span>
            <span class="platforms"><span class="chip">web</span><span class="chip">mobile</span></span>
          </button>
        </li>
        <li>
          <button type="button" class="row" data-open="iam" aria-haspopup="dialog">
            <span class="row-name">IAM</span>
            <span class="row-note">Single sign on. The service the others log into</span>
            <span class="platforms"><span class="chip">web</span></span>
          </button>
        </li>
        <li>
          <button type="button" class="row" data-open="analytics" aria-haspopup="dialog">
            <span class="row-name">Analytics</span>
            <span class="row-note">Elasticsearch indexing, spreadsheet exports, scraping</span>
            <span class="platforms"><span class="chip">web</span></span>
          </button>
        </li>
      </ul>
    </template>

    <template data-window="logistics" data-title="experience/logistics">
      <p>Multi company fleet management. Plain PHP 7.4, MySQL and vanilla JS on the
        web side: a Leaflet map with OSRM route optimisation, a public delivery
        tracking page, and an Excel order import that geocodes addresses and assigns
        trucks. The Flutter driver app pulls routes over a bearer token REST API,
        walks turn by turn stops in flutter_map, reports live GPS back to the admins
        and sends an FCM push on SOS.</p>
      <p class="stub">Screenshots of the admin map and the driver app go here.</p>
    </template>

    <template data-window="fishfarm" data-title="experience/fish-farm">
      <p>Operations portal for the farm. Harvest, feed and medicine inventory,
        environment surveys, net repairs, incident logging. It replaced paper logs.
        PHP, MySQL and Bootstrap 5, with a Flutter companion app for the work that
        happens standing on a pontoon.</p>
      <p class="stub">Screenshots of the portal and the app go here.</p>
    </template>

    <template data-window="hq" data-title="experience/hq">
      <p>Laravel backend with a Tailwind and Vite front end, plus a Flutter app
        covering the same workflows.</p>
      <p class="stub">Screenshots go here.</p>
    </template>

    <template data-window="iam" data-title="experience/iam">
      <p>Single sign on, role and department mapping, per portal access control,
        shared across the company's internal systems. It is the service the other
        four log into.</p>
      <p class="stub">Screenshots go here.</p>
    </template>

    <template data-window="analytics" data-title="experience/analytics">
      <p>Elasticsearch indexing, PHPSpreadsheet exports for ABC analysis and vendor
        commission reports, and Puppeteer scraping for the sources that had no API.</p>
      <p class="stub">Screenshots go here.</p>
    </template>

    <template data-window="readme" data-title="README.md">
      <p class="lede">I build internal systems: admin portals, the mobile apps that go
        with them, and the auth, tracking and reporting services that tie them
        together. Mostly PHP, Laravel, Flutter and MySQL.</p>
      <p class="stub">More of the about copy goes here.</p>
    </template>

    <template data-window="stack" data-title="stack/">
      <p class="stub">PHP, Laravel, Flutter, MySQL, Elasticsearch, and what each one
        was actually used for. Filling this in is the next pass.</p>
    </template>

    <template data-window="env" data-title=".env">
      <p class="stub">The off the record things. Still deciding what goes in here.</p>
    </template>

    <template data-window="trash" data-title=".trash/">
      <p>Experiments that did not make the cut but are still worth opening.</p>
      <p class="stub">The Three.js portrait lives here: the photo rebuilt as a 3D head
        that tracks the cursor, blinks, and lets its hair lag behind a turn. It is
        parked, not deleted. Wiring it into this window is the next pass.</p>
    </template>

          </button>
          <span class="platforms">
            <button type="button" class="chip is-live" data-demo="hq/mobile.html" data-kind="phone" data-label="HQ, staff app" title="Mobile app, opens in a phone" aria-label="Open the HQ staff app">

    <template data-window="logistics" data-title="prime-supermarket/logistics" data-icon="folder">
      <p>Multi company fleet management. Plain PHP 7.4, MySQL and vanilla JS on the
        web side: a Leaflet map with OSRM route optimisation, a public delivery
        tracking page, and an Excel order import that geocodes addresses and assigns
        trucks. The Flutter driver app pulls routes over a bearer token REST API,
        walks turn by turn stops in flutter_map, reports live GPS back to the admins
        and sends an FCM push on SOS.</p>
      <p class="demo-open">Open the <button type="button" class="link" data-demo="logistics/index.html" data-kind="web" data-label="Logistics, admin portal">admin portal</button>
        or the <button type="button" class="link" data-demo="logistics/mobile.html" data-kind="phone" data-label="Logistics, driver app">driver app</button>.
        Both run on sample data, with the portal built on the stylesheet the real one uses.</p>
    </template>

    <template data-window="fishfarm" data-title="prime-supermarket/fish-farm" data-icon="folder">
      <p>Operations portal for the farm. Harvest, feed and medicine inventory,
        environment surveys, net repairs, incident logging. It replaced paper logs.
        PHP, MySQL and Bootstrap 5, with a Flutter companion app for the work that
        happens standing on a pontoon.</p>
      <p class="demo-open">Open the <button type="button" class="link" data-demo="fishfarm/index.html" data-kind="web" data-label="Fish Farm, operations portal">portal</button>
        or the <button type="button" class="link" data-demo="fishfarm/mobile.html" data-kind="phone" data-label="Fish Farm, crew app">crew app</button>.
        The portal carries every page in its real sidebar, on the same Argon stylesheet and a copy of the project's own demo data, and the crew app writes to the same records, so a dead fish logged on the phone turns up in the portal's list.</p>
    </template>

    <template data-window="hq" data-title="prime-supermarket/hq" data-icon="folder">
      <p>A Flutter app over a Laravel backend, phone only. No web front end was ever
        built for it, so the workflows live entirely in the app. The Laravel side is a
        versioned REST API that signs staff in through IAM and Microsoft, books meeting
        rooms through Microsoft Graph with a clash check, raises IT tickets in TeamsWork,
        takes kitchen meal orders, lists intranet memos and runs a bulletin board with
        audience rules.</p>
      <p class="demo-open">Open the <button type="button" class="link" data-demo="hq/mobile.html" data-kind="phone" data-label="HQ, staff app">staff app</button>.
        Every screen in its home grid and More tab, in all four languages, with a copy of
        the API's routes running in the page, so a room booked on Monday blocks the next
        booking and a post's audience decides who sees it. People are guest accounts and
        the rooms, tickets, menus and memos are sample data.</p>
    </template>

    <template data-window="iam" data-title="prime-supermarket/iam" data-icon="folder">
      <p>Single sign on, role and department mapping, per portal access control,
        shared across the company’s internal systems. It is the service the other
        four log into.</p>
      <p class="demo-open">Open the <button type="button" class="link" data-demo="iam/index.html" data-kind="web" data-label="IAM, admin dashboard">admin dashboard</button>.
        Users, roles per portal, access with Fresh platforms and Digital Forms
        categories, departments, portals, outlets, and the Entra and branch manager
        mappings, on the real Argon stylesheet with DataTables and select2. People are
        guest accounts and the outlets are placeholders.</p>
    </template>

    <template data-window="analytics" data-title="prime-supermarket/analytics" data-icon="folder">
      <p>Elasticsearch indexing, PHPSpreadsheet exports for ABC analysis and vendor
        commission reports, and Puppeteer scraping for the sources that had no API.</p>
      <p class="demo-open">Open the <button type="button" class="link" data-demo="analytics/index.html" data-kind="web" data-label="Analytics, dashboard">dashboard</button>.
        Every report in the real sidebar: gross profit, penetration, share of basket,
        POS and mobile transactions, no sale and slow moving stock, loyalty points and
        games, repeat purchase behaviour, the Jet and supplier reports, and the
        competitor price comparison with its product mapping. The pages run their own
        scripts against an in-browser stand-in for the Elasticsearch queries, over
        generated sales for twelve placeholder outlets.</p>
    </template>

    <template data-window="readme" data-title="README.md" data-icon="doc">
      <p class="lede">I build internal systems: admin portals, the mobile apps that go
        with them, and the auth, tracking and reporting services that tie them
        together. Mostly PHP, Laravel, Flutter and MySQL.</p>
      <p class="stub">More of the about copy goes here.</p>
    </template>

    <template data-window="stack" data-title="stack/" data-icon="folder">
      <p class="stub">PHP, Laravel, Flutter, MySQL, Elasticsearch, and what each one
        was actually used for. Filling this in is the next pass.</p>
    </template>

    <template data-window="env" data-title=".env" data-icon="doc">
      <p class="stub">The off the record things. Still deciding what goes in here.</p>
    </template>

    <template data-window="trash" data-title=".trash/" data-icon="folder">
      <p>Experiments that did not make the cut but are still worth opening.</p>
      <p class="stub">The Three.js portrait lives here: the photo rebuilt as a 3D head
        that tracks the cursor, blinks, and lets its hair lag behind a turn. It is
        parked, not deleted. Wiring it into this window is the next pass.</p>
    </template>
